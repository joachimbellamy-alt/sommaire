<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expertise : Natures des Expansions</title>
    <style>
        :root {
            --noyau: #F39C12;
            --adj: #27AE60;
            --cdn: #2980B9;
            --rel: #8E44AD;
            --select: #D6EAF8;
        }
        body { font-family: sans-serif; background: #F4F7F6; padding: 20px; -webkit-user-select: none; }
        .header { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .legend { display: flex; gap: 15px; margin-top: 10px; font-size: 0.9rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        
        .exercise-card { max-width: 850px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; }
        .sentence { font-size: 1.3rem; line-height: 3; margin-bottom: 25px; border-bottom: 1px solid #EEE; }
        
        .word { padding: 4px 6px; border-radius: 4px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .word.selected { background: var(--select); border-color: #85C1E9; }
        
        /* Classes de succès par nature */
        .found-noyau { background: var(--noyau) !important; color: white; font-weight: bold; }
        .found-adj { background: var(--adj) !important; color: white; }
        .found-cdn { background: var(--cdn) !important; color: white; }
        .found-rel { background: var(--rel) !important; color: white; }
        
        .shake { animation: shake 0.4s; background: #FADBD8; }
        @keyframes shake { 0%, 100% {transform: translateX(0)} 25% {transform: translateX(-3px)} 75% {transform: translateX(3px)} }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-val { background: #2C3E50; color: white; flex: 2; }
    </style>
</head>
<body>

<div class="header">
    <strong>Analyse syntaxique :</strong> 1. Validez le noyau (Orange). 2. Validez l'expansion associée.
    <div class="legend">
        <span><span class="dot" style="background:var(--adj)"></span> Adjectif</span>
        <span><span class="dot" style="background:var(--cdn)"></span> Complément du Nom</span>
        <span><span class="dot" style="background:var(--rel)"></span> Relative</span>
    </div>
</div>

<div class="exercise-card">
    <div id="display-zone"></div>
    <div class="controls">
        <button class="btn-val" onclick="validate()">Valider la sélection</button>
        <button onclick="reset()">Effacer</button>
    </div>
</div>

<script>
    // Format : [ID|NATURE|MOT] où nature est adj, cdn ou rel
    // [ID|pivot|MOT] pour le noyau
    const data = [
        "L' [1|pivot|officier] [1|adj|prussien] exige une [2|pivot|condition] [2|adj|révoltante] pour laisser repartir le groupe.",
        "Les [3|pivot|voyageurs] [3|adj|retenus] [3|adj|à] [3|adj|l'auberge] s'impatientent de ce [4|pivot|retard] [4|adj|imprévu].",
        "La [5|pivot|résistance] [5|adj|héroïque] de Boule de Suif se heurte à l' [6|pivot|égoïsme] [6|cdn|des] [6|cdn|autres].",
        "Le [13|pivot|mépris] [13|cdn|des] [13|cdn|honnêtes] [13|cdn|gens] envers [14|pivot|celle] [14|rel|qui] [14|rel|les] [14|rel|a] [14|rel|sauvés] souligne la cruauté de Maupassant."
    ];

    let selected = [];
    let validatedNoyaux = {}; // ID: true

    function init() {
        const zone = document.getElementById('display-zone');
        data.forEach(line => {
            const p = document.createElement('div'); p.className = 'sentence';
            const regex = /\[(\d+)\|([^|]+)\|([^\]]+)\]|([^\s\[\]]+)/g;
            let m;
            while ((m = regex.exec(line)) !== null) {
                let id = 0, type = "", text = "";
                if (m[1]) { id = m[1]; type = m[2]; text = m[3]; } else { text = m[4]; }

                const span = document.createElement('span');
                span.className = 'word'; span.textContent = text;
                span.dataset.id = id; span.dataset.type = type;
                span.onclick = () => {
                    if (span.classList.contains('found-noyau') || span.classList.contains('found-adj')) return;
                    span.classList.toggle('selected');
                    selected = span.classList.contains('selected') ? [...selected, span] : selected.filter(x => x !== span);
                };
                p.appendChild(span); p.appendChild(document.createTextNode(" "));
            }
            zone.appendChild(p);
        });
    }

    function validate() {
        if (!selected.length) return;
        const id = selected[0].dataset.id;
        const type = selected[0].dataset.type;
        const allSame = selected.every(el => el.dataset.id === id && el.dataset.type === type);

        // Validation Noyau
        if (allSame && type === 'pivot' && selected.length === 1) {
            selected[0].className = 'word found-noyau';
            validatedNoyaux[id] = true;
            selected = [];
        } 
        // Validation Expansion
        else if (allSame && validatedNoyaux[id]) {
            const totalRequired = document.querySelectorAll(`.word[data-id="${id}"][data-type="${type}"]`).length;
            if (selected.length === totalRequired) {
                selected.forEach(el => el.className = `word found-${type}`);
                selected = [];
            } else { error(); }
        } else { error(); }
    }

    function error() {
        selected.forEach(el => { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); });
    }

    function reset() {
        selected.forEach(el => el.classList.remove('selected'));
        selected = [];
    }

    init();
</script>
</body>
</html>
