<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expertise : Natures des Expansions</title>
    <style>
        :root {
            --noyau: #F39C12;
            --adj: #27AE60;
            --cdn: #2980B9;
            --rel: #8E44AD;
            --select: #D6EAF8;
            --error: #e74c3c;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #F4F7F6; 
            margin: 0; 
            display: flex; 
            height: 100vh;
            font-size: 14pt;
            -webkit-user-select: none; 
            touch-action: manipulation;
        }

        /* Barre latérale */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }

        .header { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px;}
        .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; font-size: 0.9rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        
        .exercise-card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .sentence { font-size: 1.35rem; line-height: 2.8; margin-bottom: 30px; border-bottom: 1px solid #EEE; padding-bottom: 10px; }
        
        /* Mots interactifs */
        .word { padding: 4px 8px; border-radius: 6px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; display: inline-block; }
        .word.selected { background: var(--select); border-color: #85C1E9; }
        
        /* États de succès */
        .found-noyau { background: var(--noyau) !important; color: white; font-weight: bold; }
        .found-adj { background: var(--adj) !important; color: white; }
        .found-cdn { background: var(--cdn) !important; color: white; }
        .found-rel { background: var(--rel) !important; color: white; }
        
        /* Jauge d'énergie */
        #energy-container { width: 100%; height: 18px; background: #eee; border-radius: 10px; margin: 12px 0; overflow: hidden; border: 1px solid #ddd; }
        #energy-bar { height: 100%; width: 100%; background: var(--adj); transition: 0.5s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .stats-label { font-size: 0.95rem; color: #555; margin-top: 20px; font-weight: 600; }
        .stats-value { font-weight: 800; font-size: 1.4rem; color: #2C3E50; }

        .shake { animation: shake 0.4s; background: #FADBD8 !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0)} 25% {transform: translateX(-4px)} 75% {transform: translateX(4px)} }
        
        .controls { display: flex; gap: 10px; margin-top: 25px; }
        button { padding: 18px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-val { background: #2C3E50; color: white; flex: 2; box-shadow: 0 4px 0 #1a252f; }
        .btn-val:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a252f; }
        .btn-val:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        
        .btn-reset { background: #ecf0f1; color: #7f8c8d; flex: 1; }
        
        .game-over { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="stats-label">Capital de clics :</div>
    <div id="energy-container"><div id="energy-bar"></div></div>
    <div class="stats-value" id="clics-count">32</div>
    
    <div class="stats-label">Codes couleurs :</div>
    <div class="legend">
        <span><span class="dot" style="background:var(--noyau)"></span> Noyau (Orange)</span>
        <span><span class="dot" style="background:var(--adj)"></span> Adjectif (Vert)</span>
        <span><span class="dot" style="background:var(--cdn)"></span> C. du Nom (Bleu)</span>
        <span><span class="dot" style="background:var(--rel)"></span> Relative (Violet)</span>
    </div>

    <button class="btn-val" id="main-val" style="margin-top: auto;" onclick="validate()">VALIDER LA SÉLECTION</button>
</div>

<div class="main-content">
    <div class="header">
        <p style="margin:0;"><strong>Méthode :</strong> 1. Cliquez sur le <b>noyau</b> seul, puis validez. <br> 2. Cliquez sur l'<b>expansion</b> complète, puis validez.</p>
    </div>

    <div class="exercise-card" id="card">
        <div id="display-zone"></div>
        <div class="controls">
            <button class="btn-reset" onclick="reset()">Effacer la sélection</button>
        </div>
    </div>
</div>

<script>
    // 26 cibles totales dans ce texte
    const data = [
        "L' [1|pivot|officier] [1|adj|prussien] exige une [2|pivot|condition] [2|adj|révoltante] pour laisser repartir le groupe.",
        "Les [3|pivot|voyageurs] [3|adj|retenus] [3|adj|à] [3|adj|l'auberge] s'impatientent de ce [4|pivot|retard] [4|adj|imprévu].",
        "La [5|pivot|résistance] [5|adj|héroïque] de Boule de Suif se heurte à l' [6|pivot|égoïsme] [6|cdn|des] [6|cdn|autres].",
        "Le [13|pivot|mépris] [13|cdn|des] [13|cdn|honnêtes] [13|cdn|gens] envers [14|pivot|celle] [14|rel|qui] [14|rel|les] [14|rel|a] [14|rel|sauvés] souligne la cruauté."
    ];

    let selected = [];
    let validatedNoyaux = {}; 
    let clicsMax = 32; 
    let clicsRestants = 32;

    function init() {
        const zone = document.getElementById('display-zone');
        data.forEach(line => {
            const p = document.createElement('div'); p.className = 'sentence';
            const regex = /\[(\d+)\|([^|]+)\|([^\]]+)\]|([^\s\[\]]+)/g;
            let m;
            while ((m = regex.exec(line)) !== null) {
                let id = 0, type = "", text = "";
                if (m[1]) { id = m[1]; type = m[2]; text = m[3]; } else { text = m[4]; }

                const span = document.createElement('span');
                span.className = 'word'; span.textContent = text;
                span.dataset.id = id; span.dataset.type = type;
                
                span.onclick = () => {
                    // Ignorer si déjà trouvé
                    if (span.classList.contains('found-noyau') || span.classList.contains('found-adj') || 
                        span.classList.contains('found-cdn') || span.classList.contains('found-rel')) return;
                    
                    if (!span.classList.contains('selected')) {
                        if (clicsRestants <= 0) return;
                        clicsRestants--;
                        span.classList.add('selected');
                        selected.push(span);
                    } else {
                        // On rend le clic si désélection manuelle avant validation
                        clicsRestants++;
                        span.classList.remove('selected');
                        selected = selected.filter(x => x !== span);
                    }
                    updateUI();
                };
                p.appendChild(span); p.appendChild(document.createTextNode(" "));
            }
            zone.appendChild(p);
        });
        updateUI();
    }

    function validate() {
        if (!selected.length) return;
        
        const id = selected[0].dataset.id;
        const type = selected[0].dataset.type;
        const allSame = selected.every(el => el.dataset.id === id && el.dataset.type === type);

        // Validation Noyau (Pivot)
        if (allSame && type === 'pivot' && selected.length === 1) {
            selected[0].className = 'word found-noyau';
            validatedNoyaux[id] = true;
            selected = [];
        } 
        // Validation Expansion (Adj, CDN, Rel)
        else if (allSame && type !== 'pivot' && validatedNoyaux[id]) {
            const totalRequired = document.querySelectorAll(`.word[data-id="${id}"][data-type="${type}"]`).length;
            if (selected.length === totalRequired) {
                selected.forEach(el => el.className = `word found-${type}`);
                selected = [];
            } else { error(); }
        } else {
            // Mauvais type, mauvais mot ou noyau non validé
            error();
        }
        updateUI();
    }

    function error() {
        selected.forEach(el => { 
            el.classList.add('shake'); 
            setTimeout(() => el.classList.remove('shake'), 400); 
        });
        // Les clics de l'erreur sont définitivement consommés
        setTimeout(() => {
            selected.forEach(el => el.classList.remove('selected'));
            selected = [];
            updateUI();
        }, 500);
    }

    function reset() {
        selected.forEach(el => {
            el.classList.remove('selected');
            clicsRestants++; // On rend les clics lors d'un reset manuel
        });
        selected = [];
        updateUI();
    }

    function updateUI() {
        document.getElementById('clics-count').innerText = clicsRestants;
        const bar = document.getElementById('energy-bar');
        const percent = (clicsRestants / clicsMax) * 100;
        bar.style.width = percent + "%";

        // Changement de couleur de la jauge
        if (percent < 20) bar.style.background = "var(--error)";
        else if (percent < 50) bar.style.background = "var(--noyau)";
        else bar.style.background = "var(--adj)";

        // Vérification Game Over
        if (clicsRestants <= 0 && selected.length === 0) {
            // On vérifie s'il reste des mots à trouver
            const remaining = document.querySelectorAll('.word[data-id]:not([data-id="0"]):not(.found-noyau):not(.found-adj):not(.found-cdn):not(.found-rel)');
            if (remaining.length > 0) {
                document.getElementById('card').classList.add('game-over');
                document.getElementById('main-val').disabled = true;
                alert("Plus de clics ! L'analyse s'arrête ici. Relisez bien le texte pour la prochaine fois.");
            }
        }
    }

    init();
</script>
</body>
</html>
