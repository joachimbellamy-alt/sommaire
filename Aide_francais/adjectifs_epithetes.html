<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repérage : Adjectifs Épithètes</title>
    <style>
        :root {
            --selected-bg: #D6EAF8; 
            --correct-bg: #D5F5E3;  
            --font-size: 1.25rem;
            --accent-blue: #007AFF;
            --progress-bg: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 40px 20px 100px 20px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Barre de progression */
        #progress-container {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--progress-bg);
            z-index: 1001;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: #34C759;
            transition: width 0.4s ease;
        }

        #exercice-container {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 850px;
            margin: auto;
        }

        h2 { color: #1d1d1f; text-align: center; font-weight: 600; margin-top: 0; }
        p.instruction { color: #86868b; text-align: center; margin-bottom: 30px; font-style: italic; }

        .sentence {
            line-height: 3;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            font-size: var(--font-size);
        }

        .word {
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-user-select: none;
            user-select: none;
            border: 2px solid transparent;
            touch-action: manipulation;
        }

        /* Noms noyaux en gras pour guider l'élève */
        .bold { font-weight: 700; color: #000; }

        .selected { background-color: var(--selected-bg); border-color: #AED6F1; }
        .correct { background-color: var(--correct-bg) !important; color: #145A32; cursor: default; }

        #status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 90px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid #d2d2d7;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .btn-validate { background: var(--accent-blue); color: white; }
        .btn-continue { background: #34C759; color: white; display: none; }

        .counters { font-size: 0.95rem; color: #1d1d1f; line-height: 1.4; }
        #score-display { color: var(--accent-blue); font-weight: 800; }
    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<div id="exercice-container">
    <h2>Repérage de l'adjectif épithète</h2>
    <p class="instruction">Identifiez les adjectifs qui qualifient les noms en gras.</p>
    <div id="text-engine" class="sentence"></div>
</div>

<div id="status-bar">
    <div class="counters">
        Cibles restantes : <span id="count-remaining">0</span><br>
        Score : <span id="score-display">0</span>
    </div>
    <button id="btn-val" class="btn btn-validate" onclick="validateSelection()">Valider</button>
    <button id="btn-cont" class="btn btn-continue" onclick="nextStep()">Continuer ▶</button>
</div>

<script>
    // Structure générée à partir de votre texte
    const rawData = [
        {text: "La", id: 0}, {text: "voiture", id: 0, bold: true}, {text: "lourde", id: 1}, {text: "quittait", id: 0}, {text: "enfin", id: 0}, {text: "la", id: 0}, {text: "cité", id: 0, bold: true}, {text: "normande", id: 2}, {text: "sous", id: 0}, {text: "un", id: 0}, {text: "ciel", id: 0, bold: true}, {text: "bas", id: 3}, {text: ".", id: 0},
        {text: "Les", id: 0}, {text: "voyageurs", id: 0, bold: true}, {text: "silencieux", id: 4}, {text: "observaient", id: 0}, {text: "la", id: 0}, {text: "campagne", id: 0, bold: true}, {text: "enneigée", id: 5}, {text: "par", id: 0}, {text: "les", id: 0}, {text: "vitres", id: 0, bold: true}, {text: "buées", id: 6}, {text: ".", id: 0},
        {text: "À", id: 0}, {text: "l’intérieur,", id: 0}, {text: "l'atmosphère", id: 0, bold: true}, {text: "glaciale", id: 7}, {text: "pesait", id: 0}, {text: "sur", id: 0}, {text: "les", id: 0}, {text: "passagers", id: 0, bold: true}, {text: "inquiets", id: 8}, {text: "qui", id: 0}, {text: "redoutaient", id: 0}, {text: "une", id: 0}, {text: "rencontre", id: 0, bold: true}, {text: "fâcheuse", id: 9}, {text: "avec", id: 0}, {text: "l'armée", id: 0, bold: true}, {text: "ennemie", id: 10}, {text: ".", id: 0}
    ];

    let score = 0;
    let errorsCount = {}; 
    const totalCibles = new Set(rawData.filter(w => w.id > 0).map(w => w.id)).size;

    function init() {
        const engine = document.getElementById('text-engine');
        rawData.forEach((word, index) => {
            let span = document.createElement('span');
            span.innerText = word.text;
            span.className = 'word' + (word.bold ? ' bold' : '');
            span.dataset.index = index;
            if(word.id !== 0) span.onclick = () => toggleWord(span);
            engine.appendChild(span);
        });
        updateUI();
    }

    function toggleWord(el) {
        if(el.classList.contains('correct')) return;
        el.classList.toggle('selected');
    }

    function validateSelection() {
        const selected = document.querySelectorAll('.word.selected');
        if(selected.length === 0) return;

        let selectedIds = [...new Set(Array.from(selected).map(s => rawData[s.dataset.index].id))];
        
        if(selectedIds.length > 1) {
            alert("Sélectionnez un seul adjectif (ou groupe) à la fois.");
            return;
        }

        let targetId = selectedIds[0];
        let groupExpected = rawData.filter(w => w.id === targetId);

        if(groupExpected.length === selected.length) {
            selected.forEach(s => { s.classList.remove('selected'); s.classList.add('correct'); });
            if(!errorsCount[targetId]) score++;
            document.getElementById('btn-val').style.display = 'none';
            document.getElementById('btn-cont').style.display = 'block';
        } else {
            errorsCount[targetId] = (errorsCount[targetId] || 0) + 1;
            selected.forEach(s => s.classList.remove('selected'));
        }
        updateUI();
    }

    function nextStep() {
        document.getElementById('btn-val').style.display = 'block';
        document.getElementById('btn-cont').style.display = 'none';
    }

    function updateUI() {
        const found = new Set(Array.from(document.querySelectorAll('.word.correct')).map(s => rawData[s.dataset.index].id)).size;
        document.getElementById('count-remaining').innerText = totalCibles - found;
        document.getElementById('score-display').innerText = score + " / " + totalCibles;
        
        // Mise à jour barre de progression
        const progress = (found / totalCibles) * 100;
        document.getElementById('progress-bar').style.width = progress + "%";

        if(found === totalCibles) {
            document.getElementById('btn-val').innerText = "Terminé !";
            document.getElementById('btn-val').style.background = "#1d1d1f";
        }
    }

    init();
</script>
</body>
</html>
