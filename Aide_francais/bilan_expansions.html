<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QCM : Les Expansions du Nom</title>
    <style>
        :root {
            --primary: #007AFF;
            --success: #34C759;
            --error: #FF3B30;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --hint-color: #5856D6;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #quiz-container {
            width: 100%;
            max-width: 700px;
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #8E8E93;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1C1C1E;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        #hint-btn {
            background: none;
            border: none;
            color: var(--hint-color);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        #hint-text {
            display: none;
            background: #F4F3FF;
            color: #5856D6;
            padding: 12px;
            border-radius: 10px;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 0.95rem;
            border: 1px dashed var(--hint-color);
        }

        .options-list {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 20px;
            border: 2px solid #E5E5EA;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            text-align: left;
            font-family: inherit;
        }

        .option:active { background-color: #F2F2F7; transform: scale(0.98); }
        .option.correct { border-color: var(--success); background-color: #EBF9EE; color: #1A4721; }
        .option.wrong { border-color: var(--error); background-color: #FEEBEA; color: #7D1A16; }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            display: none;
            line-height: 1.4;
        }

        .feedback.visible { display: block; }
        .feedback.correct-style { background: #EBF9EE; border-left: 5px solid var(--success); color: #1A4721; }
        .feedback.wrong-style { background: #FEEBEA; border-left: 5px solid var(--error); color: #7D1A16; }

        #btn-next {
            width: 100%;
            margin-top: 30px;
            padding: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="progress-header">
        <span id="q-count">Question 1 / 10</span>
        <span id="score-display">Score : 0</span>
    </div>
    
    <div id="quiz-content">
        <div class="question-text" id="question-label">Chargement...</div>
        
        <button id="hint-btn" onclick="toggleHint()">
            💡 Besoin d'un indice ?
        </button>
        <div id="hint-text"></div>

        <div class="options-list" id="options-container"></div>
        <div id="feedback-box" class="feedback"></div>
    </div>

    <button id="btn-next" onclick="loadNextQuestion()">Continuer ▶</button>
</div>

<script>
const quizData = [
    {
        question: "1. Dans la phrase : « La voiture pesante s'enfonce dans la neige », quelle est la nature du mot qui complète \"voiture\" ?",
        hint: "Observez si le mot est seul et s'il s'accorde en genre et en nombre avec le nom 'voiture'.",
        options: [
            { text: "Un adjectif qualificatif épithète", correct: true, feedback: "Bravo ! L'adjectif qualifie directement le nom 'voiture'." },
            { text: "Un complément du nom", correct: false, feedback: "Non. Un complément du nom est introduit par une préposition (de, pour...)." },
            { text: "Une proposition subordonnée relative", correct: false, feedback: "Faux. Il n'y a pas de verbe conjugué ici." },
            { text: "Un adverbe", correct: false, feedback: "Erreur. L'adverbe est invariable, or 'pesante' s'accorde avec 'voiture'." }
        ]
    },
    {
        question: "2. Identifiez le complément du nom dans : « Le panier de provisions est posé sur la banquette. »",
        hint: "Cherchez le groupe de mots introduit par une préposition qui précise le nom 'panier'.",
        options: [
            { text: "Le panier", correct: false, feedback: "C'est le nom noyau." },
            { text: "de provisions", correct: true, feedback: "Correct ! Il précise le contenu du panier via la préposition 'de'." },
            { text: "posé", correct: false, feedback: "C'est un participe passé employé comme adjectif." },
            { text: "sur la banquette", correct: false, feedback: "C'est un complément de lieu du verbe." }
        ]
    },
    {
        question: "3. Quelle est la fonction du groupe : « La diligence [que l'on surnomme Boule de Suif] attire les regards. » ?",
        hint: "Repérez la présence d'un pronom relatif (qui, que, dont...) et d'un verbe conjugué.",
        options: [
            { text: "Complément du nom 'diligence'", correct: false, feedback: "Presque, mais sa nature précise est une proposition subordonnée relative." },
            { text: "Sujet du verbe 'attire'", correct: false, feedback: "Le sujet est 'La diligence'." },
            { text: "Proposition subordonnée relative", correct: true, feedback: "Excellent ! On trouve le pronom relatif 'que' et un verbe conjugué." },
            { text: "Adjectif épithète", correct: false, feedback: "Un adjectif est un mot simple, pas une proposition entière." }
        ]
    },
    {
        question: "4. « Un silence pesant». Quelle subordonnée relative pourrait remplacer l'adjectif en conservant le même sens ?",
        hint: "Une subordonnée relative doit obligatoirement contenir un verbe conjugué.",
        options: [
            { text: "Un silence qui pèse lourd", correct: true, feedback: "Parfait ! 'Qui pèse' remplace l'adjectif par une relative." },
            { text: "Un silence de plomb", correct: false, feedback: "C'est un complément du nom." },
            { text: "Un silence pesamment installé", correct: false, feedback: "C'est un groupe participial." },
            { text: "Le silence pesant", correct: false, feedback: "C'est juste un changement de déterminant." }
        ]
    },
    {
        question: "5. Lequel de ces groupes contient un complément du nom ?",
        hint: "Cherchez la structure : Nom + Préposition (de, à, en, pour...) + Nom.",
        options: [
            { text: "Une mine sombre", correct: false, feedback: "'Sombre' est un adjectif." },
            { text: "L'officier prussien", correct: false, feedback: "'Prussien' est un adjectif." },
            { text: "Le marchand de vin", correct: true, feedback: "Oui ! 'de vin' complète le nom 'marchand'." },
            { text: "La dame qui grelotte", correct: false, feedback: "C'est une subordonnée relative." }
        ]
    },
    {
        question: "6. « Les bourgeois de Rouen ». Quelle est la nature de l'expansion \"de Rouen\" ?",
        hint: "Il s'agit d'un groupe nominal introduit par une préposition .",
        options: [
            { text: "Adjectif épithète", correct: false, feedback: "Ce n'est pas un adjectif." },
            { text: "Complément du nom", correct: true, feedback: "Bien joué ! C'est un groupe prépositionnel complétant le nom." },
            { text: "Proposition subordonnée relative", correct: false, feedback: "Il n'y a pas de verbe conjugué." },
            { text: "Attribut du sujet", correct: false, feedback: "Il n'y a pas de verbe d'état." }
        ]
    },
    {
        question: "7. Dans « L'odeur alléchante du poulet », combien d'expansions complètent 'odeur' ?",
        hint: "Regardez l'adjectif juste après le nom ET le groupe prépositionnel qui suit.",
        options: [
            { text: "Une seule", correct: false, feedback: "Il y en a deux." },
            { text: "Deux", correct: true, feedback: "Exact ! 'alléchante' (adjectif) et 'du poulet' (CDN)." },
            { text: "Trois", correct: false, feedback: "Non, vérifiez bien." },
            { text: "Aucune", correct: false, feedback: "Le nom est pourtant bien complété." }
        ]
    },
    {
        question: "8. Quelle est la différence majeure d'une relative par rapport à l'adjectif ?",
        hint: "Pensez aux éléments nécessaires pour former une 'proposition'.",
        options: [
            { text: "Sa place dans la phrase", correct: false, feedback: "L'adjectif peut aussi être après le nom." },
            { text: "La présence d'un verbe conjugué", correct: true, feedback: "Bravo ! La relative est une proposition à part entière." },
            { text: "L'accord avec le nom", correct: false, feedback: "L'adjectif s'accorde, pas la relative elle-même." },
            { text: "Elle ne complète pas le nom", correct: false, feedback: "Si, c'est son rôle." }
        ]
    },
    {
        question: "9. Remplacez l'adjectif par une proposition subordonnée relative dans : « Les arguments religieux ».",
        hint: "Une subordonnée relative doit contenir un pronom relatif (qui, que, dont...) et un verbe conjugué.",
        options: [
            { text: "Les arguments de la religion", correct: false, feedback: "Non, c'est un complément du nom (introduit par une préposition)." },
            { text: "Les arguments qui portent sur la religion", correct: true, feedback: "Parfait ! 'Qui portent...' est bien une proposition subordonnée relative." },
            { text: "Les arguments religieusement dits", correct: false, feedback: "C'est un adverbe." },
            { text: "Les beaux arguments", correct: false, feedback: "C'est un autre adjectif." }
        ]
    },
    {
        question: "10. Quel nom est complété par la proposition subordonnée relative : « Le voyage qui reprend sera terminé. » ?",
        hint: "L'antécédent est le nom placé juste avant le pronom relatif 'qui'.",
        options: [
            { text: "reprend", correct: false, feedback: "C'est le verbe." },
            { text: "terminé", correct: false, feedback: "C'est l'attribut." },
            { text: "Le voyage", correct: true, feedback: "Oui ! C'est le nom placé avant le pronom relatif 'qui'." },
            { text: "sera", correct: false, feedback: "C'est l'auxiliaire." }
        ]
    }
];

let currentQ = 0;
let score = 0;
let answered = false;

function initQuiz() {
    showQuestion(quizData[currentQ]);
}

function showQuestion(q) {
    answered = false;
    document.getElementById('q-count').innerText = `Question ${currentQ + 1} / ${quizData.length}`;
    document.getElementById('question-label').innerHTML = q.question;
    
    const hintBox = document.getElementById('hint-text');
    hintBox.innerText = q.hint;
    hintBox.style.display = 'none';
    document.getElementById('hint-btn').style.display = 'flex';

    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('feedback-box').className = 'feedback';
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt.text;
        btn.onclick = () => handleSelect(index, opt.correct, opt.feedback);
        container.appendChild(btn);
    });
}

function toggleHint() {
    const hintBox = document.getElementById('hint-text');
    hintBox.style.display = (hintBox.style.display === 'none') ? 'block' : 'none';
}

function handleSelect(index, isCorrect, feedbackText) {
    if (answered) return;
    answered = true;

    const options = document.querySelectorAll('.option');
    const feedbackBox = document.getElementById('feedback-box');
    document.getElementById('hint-btn').style.display = 'none';
    document.getElementById('hint-text').style.display = 'none';
    
    if (isCorrect) {
        options[index].classList.add('correct');
        feedbackBox.classList.add('visible', 'correct-style');
        score++;
    } else {
        options[index].classList.add('wrong');
        feedbackBox.classList.add('visible', 'wrong-style');
        quizData[currentQ].options.forEach((opt, i) => {
            if (opt.correct) options[i].classList.add('correct');
        });
    }

    feedbackBox.innerText = feedbackText;
    document.getElementById('score-display').innerText = `Score : ${score}`;
    document.getElementById('btn-next').style.display = 'block';
}

function loadNextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        showQuestion(quizData[currentQ]);
    } else {
        document.getElementById('quiz-container').innerHTML = `
            <div style="text-align:center; padding: 20px 0;">
                <h2 style="font-size: 2.2rem; margin-bottom:10px;">Bravo ! 🎊</h2>
                <div style="font-size: 3rem; font-weight: 800; color:var(--primary); margin: 30px 0;">
                    ${score} / ${quizData.length}
                </div>
                <button onclick="location.reload()" style="padding:15px 30px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold; font-size:1.1rem; cursor:pointer;">Recommencer</button>
            </div>
        `;
    }
}

// Lancement automatique au chargement
window.onload = initQuiz;
</script>

</body>
</html>
