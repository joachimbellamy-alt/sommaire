<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repérage des CDN</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f8f9fa;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            padding: 20px;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .pivot { font-weight: 800; color: #2c3e50; }

        .header-stats { 
            display: flex; justify-content: space-between; 
            margin-bottom: 20px; font-weight: bold; color: #666;
            border-bottom: 2px solid #eee; padding-bottom: 10px;
        }

        #exercise-zone { font-size: 1.3rem; line-height: 2.6; text-align: justify; }

        .word {
            display: inline-block;
            padding: 0 4px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.1s;
        }

        .word.selected { background-color: #d1ecf1; border: 1px solid var(--primary); }
        .word.correct { background-color: #d4edda !important; color: #155724; border: 1px solid var(--success); cursor: default; }
        .word.wrong { animation: shake 0.4s; background-color: #f8d7da; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-valider {
            width: 100%; margin-top: 30px; padding: 18px;
            background: var(--primary); color: white; border: none;
            border-radius: 12px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-stats">
        <div>CDN restants : <span id="count-left">0</span></div>
        <div>Sans faute : <span id="score-gold">0</span></div>
    </div>

    <div id="exercise-zone"></div>

    <button class="btn-valider" onclick="validateSelection()">Valider la sélection</button>
</div>

<script>
const rawText = "Le panier /de victuailles/ attise la convoitise /des passagers/. L'odeur /du poulet/ se répand dans l'espace /de la voiture/ malgré le froid /de l'hiver/. Les bourgeois /de Rouen/ observent les gestes /de la jeune femme/ avec un mélange /de faim/ et /de mépris/. Pourtant, la dame /à la voix douce/ finit par partager ses provisions /de bouche/ avec ses compagnons.";

function parseRobust(text) {
    // Regex qui capture les groupes /.../ OU les mots simples
    const regex = /\/([^\/]+)\/|([^\/\s]+)/g;
    let match;
    const result = [];
    let groupId = 1;

    while ((match = regex.exec(text)) !== null) {
        if (match[1]) { // Groupe CDN
            const groupText = match[1];
            const words = groupText.split(/\s+/);
            words.forEach(word => {
                // On sépare la ponctuation finale du mot pour le clic
                const clean = word.match(/^([a-zA-ZÀ-ÿ0-9'’]+)(.*)$/);
                if (clean) {
                    result.push({ text: clean[1], punc: clean[2], id: groupId });
                } else {
                    result.push({ text: word, punc: "", id: groupId });
                }
            });
            groupId++;
        } else { // Mot neutre
            result.push({ text: match[2], punc: "", id: 0 });
        }
    }

    // Deuxième passe pour identifier les pivots (mots juste avant un ID > 0)
    for (let i = 0; i < result.length - 1; i++) {
        if (result[i].id === 0 && result[i+1].id > 0) {
            result[i].isPivot = true;
        }
    }
    return result;
}

const data = parseRobust(rawText);
const totalGroups = Math.max(...data.map(w => w.id));
let groupsFound = 0;
let errorsByGroup = new Set();

const zone = document.getElementById('exercise-zone');

data.forEach((item, index) => {
    // Création du mot cliquable
    const span = document.createElement('span');
    span.textContent = item.text;
    span.className = 'word' + (item.isPivot ? ' pivot' : '');
    span.dataset.id = item.id;
    
    if (item.id > 0) {
        span.onclick = () => {
            if (!span.classList.contains('correct')) span.classList.toggle('selected');
        };
    }

    zone.appendChild(span);

    // Ajout de la ponctuation éventuelle (non cliquable)
    if (item.punc) {
        const puncSpan = document.createElement('span');
        puncSpan.textContent = item.punc;
        zone.appendChild(puncSpan);
    }
    
    zone.appendChild(document.createTextNode(' '));
});

function validateSelection() {
    const selected = Array.from(document.querySelectorAll('.word.selected'));
    if (!selected.length) return;

    const ids = [...new Set(selected.map(s => parseInt(s.dataset.id)))];

    if (ids.length === 1 && ids[0] > 0) {
        const targetId = ids[0];
        const expectedCount = data.filter(w => w.id === targetId).length;

        if (selected.length === expectedCount) {
            selected.forEach(s => s.classList.replace('selected', 'correct'));
            if (!errorsByGroup.has(targetId)) {
                document.getElementById('score-gold').textContent = parseInt(document.getElementById('score-gold').textContent) + 1;
            }
            groupsFound++;
            updateUI();
            return;
        }
    }
    
    ids.forEach(id => { if(id > 0) errorsByGroup.add(id); });
    selected.forEach(s => {
        s.classList.add('wrong');
        setTimeout(() => s.classList.remove('wrong', 'selected'), 500);
    });
}

function updateUI() {
    document.getElementById('count-left').textContent = totalGroups - groupsFound;
    if (groupsFound === totalGroups) {
        const msg = document.createElement('div');
        msg.innerHTML = "<br><center>✨ Excellent ! Tous les CDN ont été identifiés.</center>";
        msg.style.color = "var(--success)";
        msg.style.fontWeight = "bold";
        zone.appendChild(msg);
    }
}

updateUI();
</script>
</body>
</html>
