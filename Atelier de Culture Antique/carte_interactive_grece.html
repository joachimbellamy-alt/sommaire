<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte Interactive - Monde Grec</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        
        .map-container { 
            position: relative; 
            display: inline-block; 
            margin: 20px auto;
            border: 1px solid #999;
            line-height: 0; /* Évite les décalages sous l'image */
        }

        .map-image { 
            display: block; 
            width: 1000px; /* On fixe la largeur pour stabiliser les points */
            height: auto; 
        }

        /* Le point cible */
        .hotspot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red; /* Rouge pour le réglage, mettre 'transparent' ensuite */
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            cursor: pointer;
        }

        /* L'étiquette */
        .label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 20;
            /* Positionnement de l'étiquette juste au-dessus du point */
            bottom: 15px; 
            left: 50%;
            transform: translateX(-50%);
        }

        /* Affichage au survol */
        .hotspot:hover .label {
            opacity: 1;
        }
    </style>
</head>
<body>

    <h2>Expansion du Monde Grec (Carte Interactive)</h2>
    <p>Survolez les points rouges pour révéler les noms.</p>

    <div class="map-container">
