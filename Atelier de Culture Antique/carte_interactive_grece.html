<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        .container { position: relative; display: inline-block; cursor: crosshair; }
        .map { display: block; width: 1000px; height: auto; }
        
        /* Style des points interactifs */
        .spot {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .spot.city { background: rgba(0, 100, 255, 0.4); } /* Cités en bleu */
        .spot.tribe { background: rgba(255, 100, 0, 0.4); } /* Peuples en orange */

        /* Style des étiquettes */
        .name {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-family: sans-serif;
            white-space: nowrap;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }

        .spot:hover .name { opacity: 1; }
        .spot:hover { border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="container">
    <img src="carte_nettoyee.jpg" class="map">

    <div class="spot city" style="top: 34.5%; left: 29.5%;"><div class="name">Massalia</div></div>
    <div class="spot city" style="top: 32.5%; left: 34.8%;"><div class="name">Nikaia</div></div>
    <div class="spot tribe" style="top: 23%; left: 28%;"><div class="name">Celtes</div></div>

    <div class="spot tribe" style="top: 29%; left: 40%;"><div class="name">Étrusques</div></div>
    <div class="spot tribe" style="top: 34%; left: 45%;"><div class="name">Latins</div></div>
    <div class="spot city" style="top: 42.8%; left: 49.5%;"><div class="name">Néapolis</div></div>
    <div class="spot city" style="top: 53.6%; left: 50.8%;"><div class="name">Syracuse</div></div>
    <div class="spot city" style="top: 53.8%; left: 47.9%;"><div class="name">Agrigente</div></div>
    <div class="spot tribe" style="top: 58%; left: 35%;"><div class="name">Carthaginois</div></div>

    <div class="spot city" style="top: 44.5%; left: 66.8%;"><div class="name">Athènes</div></div>
    <div class="spot city" style="top: 49.5%; left: 65.2%;"><div class="name">Sparte</div></div>
    <div class="spot city" style="top: 42.8%; left: 62.5%;"><div class="name">Delphes</div></div>

</div>

</body>
</html>
