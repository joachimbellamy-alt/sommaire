<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        .map-container { position: relative; display: inline-block; background: #eee; }
        .map-image { display: block; width: 1000px; height: auto; }
        .hotspot { position: absolute; transform: translate(-50%, -50%); cursor: help; z-index: 10; }
        
        /* Style des étiquettes */
        .label {
            position: absolute; opacity: 0; transition: opacity 0.2s;
            background: white; border: 1px solid #666; padding: 2px 5px;
            font-family: sans-serif; font-size: 13px; font-weight: bold;
            pointer-events: none; white-space: nowrap; z-index: 20;
        }
        .hotspot:hover + .label { opacity: 1; }

        /* Types d'éléments (pour varier les couleurs si besoin) */
        .peuple { color: #555; font-style: italic; }
        .cite { color: #000; }
        .region { color: #222; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="map-container">
    <img src="carte_nettoyee.png" class="map-image"> <div class="hotspot" style="top: 23%; left: 28%; width: 80px; height: 30px;"></div>
