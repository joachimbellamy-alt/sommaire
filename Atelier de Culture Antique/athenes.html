<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice : La cité d'Athènes</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; }
        .map-container { position: relative; display: inline-block; margin-top: 20px; border: 2px solid #333; }
        img { display: block; max-width: 100%; height: auto; }
        
        .drop-zone {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 150px; height: 32px;
            background: rgba(255, 255, 255, 0.85);
            border: 2px dashed #444;
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9em; font-weight: bold;
        }

        /* Positions à ajuster selon le rendu final sur GitHub */
        #z1 { top: 42%; left: 18%; } #z2 { top: 38%; left: 28%; }
        #z3 { top: 56%; left: 25%; } #z4 { top: 51%; left: 43%; }
        #z5 { top: 40%; left: 55%; } #z6 { top: 72%; left: 30%; }
        #z7 { top: 88%; left: 40%; }

        .labels { margin-top: 25px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .label { padding: 10px 15px; background: #007bff; color: white; border-radius: 4px; cursor: grab; }
        .correct { background: #28a745 !important; border: 2px solid darkgreen; }
    </style>
</head>
<body>

    <h2>Complétez le schéma de la cité d'Athènes</h2>
    
    <div class="map-container">
        <img src="athenes.png" alt="Plan d'Athènes">
        
        <div id="z1" class="drop-zone" data-ans="La campagne">1</div>
        <div id="z2" class="drop-zone" data-ans="Un village">2</div>
        <div id="z3" class="drop-zone" data-ans="Les remparts de la ville">3</div>
        <div id="z4" class="drop-zone" data-ans="L'agora">4</div>
        <div id="z5" class="drop-zone" data-ans="L'Acropole">5</div>
        <div id="z6" class="drop-zone" data-ans="Les Longs Murs">6</div>
        <div id="z7" class="drop-zone" data-ans="Le port du Pirée">7</div>
    </div>

    <div class="labels">
        <div class="label" draggable="true">L'agora</div>
        <div class="label" draggable="true">Le port du Pirée</div>
        <div class="label" draggable="true">La campagne</div>
        <div class="label" draggable="true">L'Acropole</div>
        <div class="label" draggable="true">Un village</div>
        <div class="label" draggable="true">Les Longs Murs</div>
        <div class="label" draggable="true">Les remparts de la ville</div>
    </div>

    <script>
        const labels = document.querySelectorAll('.label');
        const zones = document.querySelectorAll('.drop-zone');

        labels.forEach(l => {
            l.addEventListener('dragstart', e => e.dataTransfer.setData('text', e.target.innerText));
        });

        zones.forEach(z => {
            z.addEventListener('dragover', e => e.preventDefault());
            z.addEventListener('drop', e => {
                e.preventDefault();
                const txt = e.dataTransfer.getData('text');
                if (txt === z.getAttribute('data-ans')) {
                    z.innerText = txt;
                    z.classList.add('correct');
                    Array.from(labels).find(lbl => lbl.innerText === txt).style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
