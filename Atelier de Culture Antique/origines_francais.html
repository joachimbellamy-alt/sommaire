<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QCM : Les origines du français</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 14pt;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            -webkit-user-select: none;
            user-select: none;
        }
        .container { max-width: 800px; margin: auto; }
        .question-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .option {
            display: block;
            padding: 10px 15px;
            margin: 8px 0;
            background: #D6EAF8;
            border-radius: 8px;
            cursor: pointer;
        }
        .selected { background: #AED6F1 !important; border: 2px solid #5DADE2; }
        .correct { background: #D5F5E3 !important; }
        button {
            width: 100%;
            padding: 15px;
            background: #2C3E50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.25rem;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>

<div class="container" id="quiz">
    <h1>Les origines du français</h1>
    <div id="questions-zone"></div>
    <button onclick="valider()">Valider les réponses</button>
</div>

<script>
const data = [
    {q: "Quelle langue était parlée par les Gaulois ?", options: ["Latin classique", "Gaulois", "Roman", "Francique"], correct: 1},
    {q: "Quel type de latin est la base du français ?", options: ["Latin classique", "Latin populaire", "Latin médiéval", "Grec"], correct: 1},
    {q: "Quel peuple germanique a influencé le latin en Gaule ?", options: ["Vikings", "Francs", "Romains", "Grecs"], correct: 1},
    {q: "Que sont les Serments de Strasbourg (842) ?", options: ["Dictionnaire", "Promesse royale", "Ordonnance", "Texte latin"], correct: 1},
    {q: "Où le 'français' s'est-il développé ?", options: ["Sud France", "Bassin parisien", "Belgique", "Colonies"], correct: 1},
    {q: "Quel événement du 16e a boosté le vocabulaire ?", options: ["Révolution", "Renaissance", "Colonisation", "Académie"], correct: 1},
    {q: "Quelle ordonnance impose le français en 1539 ?", options: ["Villers-Cotterêts", "Nantes", "École", "Charte"], correct: 0},
    {q: "Qui a fondé l'Académie française ?", options: ["Louis XIV", "Richelieu", "François Ier", "Charlemagne"], correct: 1},
    {q: "Quel rôle ont eu les langues régionales ?", options: ["Aucun", "Créées par le français", "Enrichi le français", "Lois"], correct: 2},
    {q: "Comment les créoles se sont-ils formés ?", options: ["Colonisation", "Académie", "Italien", "Renaissance"], correct: 0},
    {q: "Rôle des médias aux 19e/20e ?", options: ["Division", "Suppression latin", "Unification", "Latin pop"], correct: 2},
    {q: " quelle langue  étrangère influence beaucoup le français aujourd'hui ?", options: ["Italien", "Espagnol", "Anglais", "Arabe"], correct: 2},
    {q: "Pourquoi créer des mots aujourd'hui ?", options: ["Remplacer latin", "Technologies", "Décret", "Effacer gaulois"], correct: 1},
    {q: "Le français est-il une langue figée ?", options: ["Oui (Richelieu)", "Non, vivante", "Oui (Villers)", "Disparue"], correct: 1},
    {q: "Qu'est-ce que le 'français classique' ?", options: ["Gaulois", "Langue 17e s.", "Réseaux sociaux", "Latin"], correct: 1}
];

const zone = document.getElementById('questions-zone');
data.forEach((item, qIdx) => {
    let html = `<div class="question-card"><p>${qIdx+1}. ${item.q}</p>`;
    item.options.forEach((opt, oIdx) => {
        html += `<div class="option" onclick="toggle(this, ${qIdx}, ${oIdx})">${opt}</div>`;
    });
    zone.innerHTML += html + `</div>`;
});

function toggle(el, qIdx, oIdx) {
    el.parentNode.querySelectorAll('.option').forEach(n => n.classList.remove('selected'));
    el.classList.add('selected');
    el.dataset.answer = oIdx;
}

function valider() {
    document.querySelectorAll('.question-card').forEach((card, qIdx) => {
        const selected = card.querySelector('.selected');
        if(selected && parseInt(selected.dataset.answer) === data[qIdx].correct) {
            card.classList.add('correct');
        }
    });
}
</script>
</body>
</html>
