<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellérophon et la Chimère</title>
<style>
  :root{
    --papyrus:#f4ead5; --papyrus2:#ebdcbc; --encre:#2b2118; --terre:#a3472a;
    --terre-sombre:#7a2f1a; --or:#c09a3e; --bleu:#2f5d8a; --eau:#4a90c8; --eau2:#2c6fa8;
    --vert:#3b7d3b; --ombre:0 2px 10px rgba(60,40,20,.18);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papyrus);color:var(--encre);font-family:Georgia,"Times New Roman",serif;}
  header{background:var(--terre-sombre);color:#f8efdc;padding:14px 20px;text-align:center;border-bottom:4px solid var(--or)}
  header h1{margin:0;font-size:1.6rem;letter-spacing:.06em}
  header p{margin:4px 0 0;font-style:italic;opacity:.85}
  nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:10px 10px 0;
      background:var(--papyrus2);border-bottom:2px solid var(--terre)}
  nav button{font:inherit;font-size:1rem;border:2px solid var(--terre);border-bottom:none;
      background:#f8f1e1;color:var(--terre-sombre);padding:8px 16px;border-radius:10px 10px 0 0;cursor:pointer;min-width:52px}
  nav button.actif{background:var(--terre);color:#fff;font-weight:bold}
  nav button.fait::after{content:" ✓";color:var(--vert)}
  nav button.actif.fait::after{color:#d6f5c8}

  /* Bandeau des lettres gagnées */
  .butin{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;background:#efe3c8;border-bottom:1px solid #d9c59a}
  .butin span.lbl{font-style:italic;color:#6b5a44;margin-right:6px}
  .tuile{width:38px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;
         border:2px dashed #c4ad80;border-radius:6px;color:#c4ad80;background:#f8f1e1}
  .tuile.gagnee{border:2px solid var(--or);background:#fff6d8;color:var(--terre-sombre);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .tuile.cle{width:44px}

  main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  .onglet{display:none}
  .onglet.vig.actif{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) 220px;gap:22px;align-items:start}
  .onglet.actif{display:block}
  .vignette img{width:100%;border:3px solid var(--encre);border-radius:6px;box-shadow:var(--ombre);display:block}
  .latin{background:#fffaf0;border-left:6px solid var(--terre);padding:14px 18px;font-size:1.45rem;line-height:1.45;border-radius:4px;box-shadow:var(--ombre);margin:0 0 16px}
  .latin .mot-lien{color:var(--terre);font-weight:bold;text-decoration:underline dotted}
  h2{font-size:1.1rem;margin:0 0 8px;color:var(--terre-sombre);text-transform:uppercase;letter-spacing:.08em}
  table{width:100%;border-collapse:collapse;background:#fffaf0;box-shadow:var(--ombre);font-size:1rem}
  td{padding:6px 10px;border-bottom:1px solid #e3d4b3;vertical-align:top}
  td:first-child{font-weight:bold;white-space:nowrap}
  td .nat{display:block;font-weight:normal;font-style:italic;font-size:.85rem;color:#7a6a55}
  tr.lien td:first-child{color:var(--terre)}
  textarea{width:100%;min-height:90px;font:inherit;font-size:1.1rem;padding:10px;border:2px solid #cdb88f;border-radius:6px;background:#fffdf7;margin-top:16px;resize:vertical}
  textarea.juste{border-color:var(--vert);background:#f1f9ee}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .actions button{font:inherit;padding:7px 14px;border-radius:6px;cursor:pointer}
  .btn-verif{background:var(--vert);color:#fff;border:none;font-weight:bold}
  .btn-corr{background:none;border:1px dashed var(--bleu);color:var(--bleu)}
  .btn-corr[hidden]{display:none}
  .retour{margin-top:10px;padding:10px 14px;border-radius:6px;font-size:1.05rem;display:none}
  .retour.ko{display:block;background:#fbeae4;border-left:5px solid var(--terre)}
  .retour.ok{display:block;background:#eaf6e6;border-left:5px solid var(--vert)}
  .retour .grande{display:inline-flex;width:54px;height:62px;align-items:center;justify-content:center;font-size:2.2rem;font-weight:bold;
      background:#fff6d8;border:3px solid var(--or);border-radius:8px;color:var(--terre-sombre);vertical-align:middle;margin-right:10px;animation:pop .5s}
  @keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .corrige{display:none;margin:8px 0 0;padding:10px 14px;background:#e8f0f8;border-radius:6px;border-left:5px solid var(--bleu);font-size:1.1rem}
  .corrige.vue{display:block}

  /* Clepsydre */
  .clepsydre{position:sticky;top:12px;text-align:center;background:#fffaf0;border:2px solid var(--or);border-radius:12px;padding:12px 10px;box-shadow:var(--ombre)}
  .clepsydre svg{width:100%;max-width:180px;height:auto}
  .temps{font-size:2.2rem;font-weight:bold;font-variant-numeric:tabular-nums;margin:4px 0}
  .temps.fini{color:var(--terre);animation:clignote 1s steps(2) infinite}
  @keyframes clignote{50%{opacity:.25}}
  .boutons{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .boutons button{font:inherit;padding:7px 12px;border-radius:8px;border:none;cursor:pointer;background:var(--bleu);color:#fff}
  .boutons button.raz{background:#8a7a62}
  .message{min-height:1.4em;margin-top:6px;font-style:italic;color:var(--terre-sombre)}
  .goutte{animation:tombe .6s linear infinite}
  .goutte.d2{animation-delay:.2s}.goutte.d3{animation-delay:.4s}
  @keyframes tombe{from{transform:translateY(0);opacity:1}to{transform:translateY(46px);opacity:.2}}
  .arret .goutte{display:none}

  /* Énigme */
  .parchemin{max-width:760px;margin:10px auto;background:#fffaf0;border:3px double var(--or);border-radius:12px;padding:28px 32px;box-shadow:var(--ombre);text-align:center}
  .parchemin .voix{font-size:1.9rem;font-style:italic;color:var(--terre-sombre);margin:10px 0 18px;line-height:1.35}
  .parchemin p{font-size:1.15rem;line-height:1.55}
  .parchemin .regle{text-align:left;background:#f6eedb;border-radius:8px;padding:12px 18px}
  .parchemin .regle li{margin:6px 0}
  .gros-bouton{font:inherit;font-size:1.2rem;background:var(--terre);color:#fff;border:none;padding:12px 24px;border-radius:10px;cursor:pointer;margin-top:14px}
  .verrou{font-size:3rem}
  .lettres-dispo,.cases{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0;min-height:66px}
  .lettres-dispo button,.cases button{width:52px;height:60px;font:inherit;font-size:1.9rem;font-weight:bold;border-radius:8px;cursor:pointer}
  .lettres-dispo button{background:#fff6d8;border:3px solid var(--or);color:var(--terre-sombre)}
  .lettres-dispo button:disabled{opacity:.2;cursor:default}
  .cases button{background:#f8f1e1;border:2px dashed #b9a272;color:var(--terre-sombre)}
  .cases.gagne button{background:#eaf6e6;border:3px solid var(--vert);color:var(--vert)}
  .verdict{font-size:1.3rem;min-height:1.6em;font-weight:bold}
  .verdict.ok{color:var(--vert)} .verdict.ko{color:var(--terre)}
  #recapListe ol{background:#fffaf0;padding:16px 16px 16px 44px;box-shadow:var(--ombre);border-radius:6px;font-size:1.1rem;text-align:left}
  #recapListe li{margin-bottom:12px}
  #recapListe .la{font-style:italic;color:#6b5a44;display:block}
  #recapListe .vide{color:#b0a08a}
  .navbas{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
  .navbas button{font:inherit;background:var(--terre);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer}
  .navbas button:disabled{opacity:.3;cursor:default}
  .discret{font:inherit;font-size:.9rem;background:none;border:none;color:#8a7a62;text-decoration:underline;cursor:pointer;margin-top:20px}

  @media (max-width:900px){
    .onglet.vig.actif{grid-template-columns:1fr 1fr}
    .clepsydre{grid-column:1 / -1;position:static;display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px}
  }
  @media (max-width:620px){
    .onglet.vig.actif{grid-template-columns:1fr}
    .clepsydre{grid-template-columns:1fr}
    .parchemin{padding:18px 16px}
  }
</style>
</head>
<body>
<header>
  <h1>Bellerophon et Chimaera</h1>
  <p>Traduis chaque vignette avant que la clepsydre ne soit vide, et gagne les lettres de l'énigme !</p>
</header>
<nav id="nav"></nav>
<div class="butin" id="butin"></div>
<main id="main"></main>

    vocab:[["itaque","c'est pourquoi, donc",1],["heros, herois (m.)","le héros"],["Chimaera, -ae (f.)","la Chimère"],["necat","tuer","necare"],["incola, -ae (m.)","l'habitant"],["liberat","libérer","liberare"]],
    lettre:"🔑" }
];

const DUREE = 120;
const N = VIGNETTES.length;
const minuteurs = VIGNETTES.map(()=>({reste:DUREE, enCours:false, dernier:0}));
const PAGES = ["enigme", ...VIGNETTES.map((_,i)=>i), "fin"];
let courant = "enigme";
let reussi = VIGNETTES.map((_,i)=>lire("chimaera-ok"+i)==="1");
let placees = [];   // indices (dans lettresDispo) placés dans les cases

function stocker(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lire(k){try{return localStorage.getItem(k)}catch(e){return null}}
function normaliser(t){
  return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
          .replace(/[’`]/g,"'").replace(/\s+/g," ");
}

function svgClepsydre(i){
  return `
  <svg viewBox="0 0 160 250" aria-label="Clepsydre">
    <defs>
      <clipPath id="haut${i}"><path d="M20 20 L140 20 L100 100 L60 100 Z"/></clipPath>
      <clipPath id="bas${i}"><path d="M30 160 L130 160 L130 232 Q130 238 124 238 L36 238 Q30 238 30 232 Z"/></clipPath>
      <linearGradient id="g${i}" x1="0" x2="1"><stop offset="0" stop-color="#2c6fa8"/><stop offset=".5" stop-color="#4a90c8"/><stop offset="1" stop-color="#2c6fa8"/></linearGradient>
    </defs>
    <rect x="8" y="10" width="144" height="8" rx="3" fill="#8a5a2b"/>
    <rect x="8" y="240" width="144" height="8" rx="3" fill="#8a5a2b"/>
    <rect x="12" y="18" width="5" height="222" fill="#a8743f"/>
    <rect x="143" y="18" width="5" height="222" fill="#a8743f"/>
    <rect id="eauHaut${i}" clip-path="url(#haut${i})" x="0" y="20" width="160" height="80" fill="url(#g${i})"/>
    <path d="M20 20 L140 20 L100 100 L60 100 Z" fill="none" stroke="#7a2f1a" stroke-width="3"/>
    <rect x="76" y="100" width="8" height="10" fill="#7a2f1a"/>
    <g>
      <circle class="goutte" cx="80" cy="114" r="3" fill="#4a90c8"/>
      <circle class="goutte d2" cx="80" cy="114" r="3" fill="#4a90c8"/>
      <circle class="goutte d3" cx="80" cy="114" r="3" fill="#4a90c8"/>
    </g>
    <rect id="eauBas${i}" clip-path="url(#bas${i})" x="0" y="238" width="160" height="0" fill="url(#g${i})"/>
    <path d="M30 160 L130 160 L130 232 Q130 238 124 238 L36 238 Q30 238 30 232 Z" fill="none" stroke="#7a2f1a" stroke-width="3"/>
    ${[0,1,2,3].map(k=>`<line x1="122" x2="130" y1="${220-k*18}" y2="${220-k*18}" stroke="#7a2f1a" stroke-width="1.5"/>`).join("")}
  </svg>`;
}

function construire(){
  const nav=document.getElementById("nav"), main=document.getElementById("main");

  // --- Onglet Énigme ---
  ajouterOnglet("🗝️ Énigme","enigme");
  const e=document.createElement("section"); e.className="onglet"; e.id="p-enigme";
  e.innerHTML=`
    <div class="parchemin">
      <h2>L'énigme du sphinx de Lycie</h2>
      <p class="voix">« Né du sang d'une gorgone au regard de pierre… »</p>
      <p>Qui suis-je ? Pour le découvrir, traduis l'histoire de Bellérophon et de la Chimère.</p>
      <ul class="regle">
        <li>Quand ton professeur valide ta traduction, tu gagnes <b>une lettre</b> du mot mystère.</li>
        <li>La dernière vignette te donne la <b>clé 🔑</b> qui ouvre l'énigme finale.</li>
        <li>Tu as <b>2 minutes</b> par vignette : surveille la clepsydre !</li>
        <li>À la fin, remets les lettres dans l'ordre pour trouver la réponse… en latin !</li>
      </ul>
      <button class="gros-bouton" id="commencer">Commencer la traduction →</button>
    </div>`;
  main.appendChild(e);
  e.querySelector("#commencer").onclick=()=>afficher(0);

  // --- Vignettes ---
  VIGNETTES.forEach((v,i)=>{
    ajouterOnglet(String(i+1),i);
    const s=document.createElement("section");
    s.className="onglet vig"; s.id="p-"+i;
    s.innerHTML=`
      <div class="vignette"><img src="${IMGS[i]}" alt="Vignette ${i+1}"></div>
      <div>
        <p class="latin">${v.latin}</p>
        <h2>Vocabulaire</h2>
        <table>${v.vocab.map(([la,fr,inf])=>{
            if(typeof inf==="string")
              return `<tr><td>${inf}<span class="nat">ici : ${la}</span></td><td>${fr}</td></tr>`;
            return `<tr class="${inf===1?'lien':''}"><td>${la}</td><td>${fr}</td></tr>`}).join("")}</table>
        <textarea id="t${i}" placeholder="Écris ta traduction ici…"></textarea>
        <div class="actions">
          <button class="btn-verif">✔ Validation du professeur</button>
        </div>
        <div class="retour" id="r${i}"></div>
        <div class="navbas">
          <button data-aller="${i-1}">← ${i===0?"Énigme":"Vignette précédente"}</button>
          <button data-aller="${i+1}">${i===N-1?"Énigme finale →":"Vignette suivante →"}</button>
        </div>
      </div>
      <div class="clepsydre arret" id="c${i}">
        ${svgClepsydre(i)}
        <div>
          <div class="temps" id="tps${i}">2:00</div>
          <div class="boutons">
            <button data-act="go">▶ Départ</button>
            <button data-act="raz" class="raz">↺ Recommencer</button>
          </div>
          <div class="message" id="msg${i}"></div>
        </div>
      </div>`;
    main.appendChild(s);

    const ta=s.querySelector("textarea");
    ta.value=lire("chimaera-t"+i)||"";
    ta.oninput=()=>stocker("chimaera-t"+i,ta.value);
    s.querySelector(".btn-verif").onclick=()=>valider(i);
    s.querySelectorAll("[data-aller]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.aller; afficher(k<0?"enigme":k>=N?"fin":k);});
    s.querySelector("[data-act=go]").onclick=()=>basculer(i);
    s.querySelector("[data-act=raz]").onclick=()=>{ raz(i); basculer(i); };
    if(reussi[i]) marquerReussi(i,false);
    dessiner(i);
  });

  // --- Énigme finale ---
  ajouterOnglet("🏛️ Énigme finale","fin");
  const f=document.createElement("section"); f.className="onglet"; f.id="p-fin";
  main.appendChild(f);
}

function ajouterOnglet(txt,page){
  const b=document.createElement("button");
  b.textContent=txt; b.dataset.page=page; b.onclick=()=>afficher(page);
  document.getElementById("nav").appendChild(b);
}

// C'est l'enseignant qui valide la traduction (pas de correction automatique).
function valider(i){
  const ta=document.getElementById("t"+i), r=document.getElementById("r"+i);
  if(reussi[i]){
    if(!codeProf("Annuler la validation de la vignette "+(i+1)+" ?",r)) return;
    reussi[i]=false; stocker("chimaera-ok"+i,"");
    r.className="retour"; ta.classList.remove("juste");
    document.querySelector(`#p-${i} .btn-verif`).textContent="✔ Validation du professeur";
    lettresDispo=null; placees=[]; majButin(); majNav(); return;
  }
  if(!ta.value.trim()){r.className="retour ko";r.textContent="Écris d'abord ta traduction !";return;}
  if(!codeProf("Validation de la vignette "+(i+1)+".",r)) return;
  reussi[i]=true; stocker("chimaera-ok"+i,"1"); marquerReussi(i,true);
}
const CODE_PROF = "verum";
function codeProf(titre,r){
  const rep=prompt(titre+"\nCode du professeur :");
  if(rep===null) return false;
  if(rep.trim().toLowerCase()!==CODE_PROF){
    if(r){ r.className="retour ko"; r.textContent="Code incorrect : seul le professeur peut valider."; }
    else alert("Code incorrect.");
    return false;
  }
  return true;
}

function marquerReussi(i,anime){
  const v=VIGNETTES[i], r=document.getElementById("r"+i);
  r.className="retour ok";
  r.innerHTML = v.lettre==="🔑"
    ? `<span class="grande">🔑</span> Bravo ! Tu as gagné <b>la clé</b> de l'énigme finale.`
    : `<span class="grande">${v.lettre}</span> Bravo ! Tu as gagné la lettre <b>${v.lettre}</b>.`;
  if(!anime) r.querySelector(".grande").style.animation="none";
  document.getElementById("t"+i).classList.add("juste");
  document.querySelector(`#p-${i} .btn-verif`).textContent="↺ Annuler la validation";
  if(anime) carillon();
  majButin(); majNav();
}

function majButin(){
  const b=document.getElementById("butin");
  b.innerHTML=`<span class="lbl">Mes lettres :</span>`+VIGNETTES.map((v,i)=>
    `<span class="tuile ${v.lettre==="🔑"?"cle":""} ${reussi[i]?"gagnee":""}" title="Vignette ${i+1}">${reussi[i]?v.lettre:"?"}</span>`).join("");
}

function majNav(){
  document.querySelectorAll("#nav button").forEach(b=>{
    const p=b.dataset.page;
    b.classList.toggle("actif",String(courant)===p);
    if(!isNaN(+p) && p!=="") b.classList.toggle("fait",reussi[+p]);
  });
}

function afficher(page){
  if(typeof courant==="number" && minuteurs[courant].enCours) basculer(courant);
  courant=page;
  document.querySelectorAll(".onglet").forEach(s=>s.classList.toggle("actif",s.id==="p-"+page));
  if(page==="fin") remplirFin();
  // La clepsydre démarre dès que la vignette s'affiche (sauf si déjà validée ou temps écoulé)
  if(typeof page==="number" && !reussi[page] && minuteurs[page].reste>0) basculer(page);
  majNav(); window.scrollTo({top:0,behavior:"smooth"});
}

// --- Énigme finale ---
function remplirFin(){
  const f=document.getElementById("p-fin");
  const lettres=VIGNETTES.map((v,i)=>reussi[i]&&v.lettre!=="🔑"?v.lettre:null).filter(Boolean);
  const cle=reussi[N-1];
  const recap=`<div id="recapListe"><h2 style="margin-top:28px">Ma traduction complète</h2><ol>${VIGNETTES.map((v,i)=>{
     const t=document.getElementById("t"+i).value.trim();
     return `<li><span class="la">${v.latin.replace(/<[^>]+>/g,"")}</span>${t?t.replace(/</g,"&lt;"):'<span class="vide">(pas encore traduit)</span>'}</li>`}).join("")}</ol></div>`;

  if(!cle || lettres.length<SOLUTION.length){
    const manque=VIGNETTES.map((_,i)=>reussi[i]?null:i+1).filter(Boolean);
    f.innerHTML=`<div class="parchemin">
      <div class="verrou">🔒</div>
      <p class="voix">« Né du sang d'une gorgone au regard de pierre… »</p>
      <p>L'énigme est encore verrouillée. Il te manque ${cle?"":"<b>la clé 🔑</b> et "}des lettres.</p>
      <p>Vignette${manque.length>1?"s":""} à réussir : <b>${manque.join(", ")}</b></p>
      ${recap}
      <button class="discret" id="effacer">Tout recommencer (effacer traductions et lettres)</button>
    </div>`;
  } else {
    if(!lettresDispo) lettresDispo=lettres.slice();
    f.innerHTML=`<div class="parchemin">
      <div class="verrou">🔓</div>
      <p class="voix">« Né du sang d'une gorgone au regard de pierre… »</p>
      <p>Clique sur les lettres pour les remettre dans l'ordre. Clique sur une case pour retirer sa lettre.</p>
      <div class="cases" id="cases"></div>
      <div class="lettres-dispo" id="dispo"></div>
      <div class="verdict" id="verdict"></div>
      ${recap}
      <button class="discret" id="effacer">Tout recommencer (effacer traductions et lettres)</button>
    </div>`;
    dessinerAnagramme();
  }
  f.querySelector("#effacer").onclick=()=>{
    if(!codeProf("Effacer toutes les traductions et toutes les lettres gagnées ?")) return;
    VIGNETTES.forEach((_,i)=>{
      stocker("chimaera-t"+i,""); stocker("chimaera-ok"+i,"");
      const ta=document.getElementById("t"+i); ta.value=""; ta.classList.remove("juste");
      document.getElementById("r"+i).className="retour";
      document.querySelector(`#p-${i} .btn-verif`).textContent="✔ Validation du professeur";
      raz(i);
    });
    reussi=reussi.map(()=>false); lettresDispo=null; placees=[];
    majButin(); majNav(); afficher("enigme");
  };
}

let lettresDispo=null;
function dessinerAnagramme(){
  const cases=document.getElementById("cases"), dispo=document.getElementById("dispo"), verdict=document.getElementById("verdict");
  cases.innerHTML=""; dispo.innerHTML=""; cases.classList.remove("gagne");
  for(let k=0;k<SOLUTION.length;k++){
    const b=document.createElement("button");
    const idx=placees[k];
    b.textContent=idx!==undefined?lettresDispo[idx]:"";
    b.onclick=()=>{ if(placees[k]!==undefined){placees.splice(k,1);dessinerAnagramme();} };
    cases.appendChild(b);
  }
  lettresDispo.forEach((l,idx)=>{
    const b=document.createElement("button"); b.textContent=l;
    b.disabled=placees.includes(idx);
    b.onclick=()=>{ if(placees.length<SOLUTION.length){placees.push(idx);dessinerAnagramme();} };
    dispo.appendChild(b);
  });
  if(placees.length===SOLUTION.length){
    const mot=placees.map(i=>lettresDispo[i]).join("");
    if(mot===SOLUTION){
      cases.classList.add("gagne"); verdict.className="verdict ok";
      verdict.innerHTML="PEGASUS ! Bravo ! Pégase, le cheval ailé, est né du sang de Méduse, la Gorgone qui changeait en pierre ceux qui croisaient son regard.";
      dispo.innerHTML=""; fanfare();
    } else { verdict.className="verdict ko"; verdict.textContent="Ce n'est pas le bon mot… Clique sur une case pour retirer une lettre."; }
  } else { verdict.className="verdict"; verdict.textContent=""; }
}

// --- Clepsydre ---
function dessiner(i){
  const m=minuteurs[i], f=m.reste/DUREE;
  const h=80*f, eh=document.getElementById("eauHaut"+i);
  eh.setAttribute("y",100-h); eh.setAttribute("height",h);
  const hb=72*(1-f), eb=document.getElementById("eauBas"+i);
  eb.setAttribute("y",238-hb); eb.setAttribute("height",hb);
  const s=Math.ceil(m.reste), el=document.getElementById("tps"+i);
  el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.classList.toggle("fini",m.reste<=0);
  document.getElementById("c"+i).classList.toggle("arret",!m.enCours);
  document.querySelector(`#c${i} [data-act=go]`).textContent=
     m.enCours?"❚❚ Pause":(m.reste<DUREE&&m.reste>0?"▶ Reprendre":"▶ Départ");
}
function basculer(i){
  const m=minuteurs[i]; if(m.reste<=0) return;
  m.enCours=!m.enCours; m.dernier=performance.now();
  document.getElementById("msg"+i).textContent=m.enCours?"L'eau s'écoule…":"En pause";
  dessiner(i);
  if(m.enCours) requestAnimationFrame(t=>boucle(i,t));
}
function raz(i){
  const m=minuteurs[i]; m.enCours=false; m.reste=DUREE;
  document.getElementById("msg"+i).textContent=""; dessiner(i);
}
function boucle(i,t){
  const m=minuteurs[i]; if(!m.enCours) return;
  m.reste=Math.max(0,m.reste-(t-m.dernier)/1000); m.dernier=t;
  if(m.reste===0){
    m.enCours=false; document.getElementById("msg"+i).textContent="Le temps est écoulé !"; gong();
  } else if(m.reste<=30) document.getElementById("msg"+i).textContent="Plus que 30 secondes !";
  dessiner(i);
  if(m.enCours) requestAnimationFrame(t2=>boucle(i,t2));
}

// --- Sons ---
function jouer(notes,duree,vol){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach(([f,d],k)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), t0=ctx.currentTime+d;
      o.frequency.value=f; o.type="sine";
      g.gain.setValueAtTime(vol/(k%3+1),t0); g.gain.exponentialRampToValueAtTime(.001,t0+duree);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+duree);
    });
  }catch(e){}
}
function gong(){jouer([[220,0],[330,0],[440,0]],2.5,.25)}
function carillon(){jouer([[784,0],[1047,.12]],.6,.2)}
function fanfare(){jouer([[523,0],[659,.15],[784,.3],[1047,.45]],.9,.2)}

construire(); majButin(); afficher("enigme");
</script>
