<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice : Le sanctuaire d'Olympie</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --error: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .map-container { position: relative; display: inline-block; background: white; padding: 5px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        img { display: block; max-width: 1000px; height: auto; border-radius: 4px; cursor: crosshair; }
        .levels { margin-bottom: 15px; display: flex; gap: 10px; }
        .lvl-btn { padding: 8px 15px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 20px; font-size: 0.9em; }
        .lvl-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .input-group { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .num-badge { background: rgba(0,0,0,0.7); color: white; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 3px; border: 1px solid white; }
        input { width: 140px; padding: 6px; text-align: center; border: 2px solid rgba(0,0,0,0.2); border-radius: 6px; background: rgba(255,255,255,0.7); font-weight: bold; transition: 0.3s; outline: none; }
        .is-correct { border-color: var(--success) !important; background: rgba(40, 167, 69, 0.2) !important; }
        .is-wrong { border-color: var(--error) !important; background: rgba(220, 53, 69, 0.2) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .helper-text { font-size: 10px; color: #666; margin-top: 2px; height: 12px; font-weight: bold; }
        .word-bank { margin-top: 25px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 900px; padding: 15px; background: white; border-radius: 8px; }
        .word-item { padding: 8px 12px; background: #6c757d; color: white; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        .word-item.selected { background: var(--primary); }
    </style>
</head>
<body>

    <h2 id="ex-title">Le sanctuaire d'Olympie</h2>
    
    <div class="levels">
        <button class="lvl-btn" onclick="setLvl(1)" id="btn-lvl1">Niveau 1 (Aide)</button>
        <button class="lvl-btn" onclick="setLvl(2)" id="btn-lvl2">Niveau 2</button>
        <button class="lvl-btn active" onclick="setLvl(3)" id="btn-lvl3">Niveau 3 (Expert)</button>
    </div>

    <div class="map-container" id="container">
        <img id="main-img" src="olympie.png" alt="Exercice Olympie">
    </div>

    <div class="word-bank" id="word-bank"></div>

    <script>
        const EXERCICE_CONFIG = {
            title: "Le sanctuaire d'Olympie",
            image: "olympie.png", 
            points: [
                { id: 1, top: "35.5%", left: "50.8%", ans: "temple de zeus|zeus" },
                { id: 2, top: "27.8%", left: "31.3%", ans: "temple d'héra|héra|temple d'hera" },
                { id: 3, top: "31.6%", left: "39.4%", ans: "autel de zeus|autel" },
                { id: 4, top: "28.5%", left: "9.3%", ans: "gymnase" },
                { id: 5, top: "37.8%", left: "16.5%", ans: "palestre" },
                { id: 6, top: "18.3%", left: "71.0%", ans: "stade" },
                { id: 7, top: "16.7%", left: "91.5%", ans: "hippodrome" }
            ]
        };

        let currentLvl = 3;
        let selectedWord = null;

        function init() {
            document.getElementById('ex-title').innerText = EXERCICE_CONFIG.title;
            const img = document.getElementById('main-img');
            img.src = EXERCICE_CONFIG.image;
            const container = document.getElementById('container');
            const bank = document.getElementById('word-bank');
            const allWords = [];

            EXERCICE_CONFIG.points.forEach(p => {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.style.top = p.top;
                group.style.left = p.left;
                group.innerHTML = `
                    <div class="num-badge">${p.id}</div>
                    <input type="text" data-ans="${p.ans}" data-id="${p.id}" placeholder="?">
                    <div class="helper-text" id="help-${p.id}"></div>
                `;
                container.appendChild(group);
                allWords.push(p.ans.split('|')[0]);
            });

            allWords.sort(() => Math.random() - 0.5).forEach(word => {
                const btn = document.createElement('div');
                btn.className = 'word-item';
                btn.innerText = word;
                btn.onclick = () => {
                    document.querySelectorAll('.word-item').forEach(b => b.classList.remove('selected'));
                    selectedWord = word;
                    btn.classList.add('selected');
                };
                bank.appendChild(btn);
            });

            document.querySelectorAll('input').forEach(input => {
                input.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedWord) {
                        input.value = selectedWord;
                        validate(input);
                        selectedWord = null;
                        document.querySelectorAll('.word-item').forEach(b => b.classList.remove('selected'));
                    }
                };
                input.onchange = () => validate(input);
            });
        }

        function setLvl(lvl) {
            currentLvl = lvl;
            document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-lvl'+lvl).classList.add('active');
            document.querySelectorAll('input').forEach(input => {
                const pId = input.getAttribute('data-id');
                const help = document.getElementById('help-'+pId);
                const mainAns = input.getAttribute('data-ans').split('|')[0];
                if (lvl === 1) help.innerText = [...mainAns].filter(c => c !== " ").sort(() => Math.random() - 0.5).join(' ');
                else if (lvl === 2) help.innerText = "Débute par : " + mainAns[0].toUpperCase();
                else help.innerText = "";
            });
        }

        function validate(el) {
            const val = el.value.toLowerCase().trim();
            const ans = el.getAttribute('data-ans').split('|');
            if (ans.includes(val)) {
                el.classList.add('is-correct');
                el.disabled = true;
            } else {
                el.classList.add('is-wrong');
                setTimeout(() => el.classList.remove('is-wrong'), 500);
            }
        }
        window.onload = init;
    </script>
</body>
</html>
