<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Évaluation – Yvain, séance 1</title>
<style>
  :root { --fond:#fbf7ee; --encre:#2b2433; --doux:#6c6379; --bord:#d6cdb8; --vio:#6a3fb5; --ok:#1f9d63; --err:#d11a1a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--fond); color:var(--encre); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:18px; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--bord); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1 1 260px; }
  .etapes { display:flex; gap:6px; flex-wrap:wrap; }
  .etape { padding:5px 12px; border-radius:999px; background:#eee7d6; color:var(--doux); font-size:14px; font-weight:600; }
  .etape.on { background:var(--vio); color:#fff; }
  main { max-width:860px; margin:0 auto; padding:18px 16px 60px; }
  .carte { background:#fff; border:1px solid var(--bord); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  h2 { margin:0 0 8px; font-size:22px; }
  h3 { margin:0 0 6px; font-size:18px; }
  .comp { background:#f3edff; border:1px solid #d9c9f5; border-radius:10px; padding:10px 14px; font-size:15px; line-height:1.4; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; margin:10px 0; font-size:16px; }
  input[type=text], input[type=number], textarea, select { font:inherit; font-size:16px; font-weight:400; padding:10px 12px; border:1.5px solid var(--bord); border-radius:10px; width:100%; background:#fff; }
  textarea { min-height:92px; resize:vertical; line-height:1.35; }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--vio); box-shadow:0 0 0 3px rgba(106,63,181,.2); }
  button { font:inherit; font-weight:600; padding:13px 20px; border-radius:12px; border:1.5px solid var(--bord); background:#fff; cursor:pointer; }
  button.prim { background:var(--vio); border-color:var(--vio); color:#fff; }
  button.petit { padding:8px 12px; font-size:16px; }
  button:disabled { opacity:.4; cursor:default; }
  .barre-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .compteur { font-weight:700; color:var(--vio); margin-left:auto; font-size:20px; }
  .msg { color:var(--err); font-size:15px; min-height:20px; }
  .qrep { border:1.5px solid var(--bord); border-radius:12px; padding:12px; margin-bottom:12px; background:#fff; }
  .qrep.fait { border-color:#9fd8bb; background:#f6fcf9; }
  .qrep .q { display:flex; gap:10px; align-items:flex-start; font-weight:600; line-height:1.3; margin-bottom:8px; }
  .num { flex:0 0 30px; height:30px; border-radius:50%; background:var(--vio); color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .pts { margin-left:auto; flex:0 0 auto; font-size:13px; color:var(--doux); font-weight:600; white-space:nowrap; }
  .aide { color:var(--doux); font-size:15px; }
  .modale { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modale[hidden] { display:none; }
  .modale .carte { max-width:560px; width:100%; margin:0; }
  a.bouton { display:inline-block; text-decoration:none; font-weight:600; padding:14px 22px; border-radius:12px; background:var(--vio); color:#fff; }
  /* espace enseignant */
  .prof-barre { position:sticky; top:56px; z-index:4; background:#fff; border:1px solid var(--bord); border-radius:12px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .prof-barre button { padding:9px 13px; font-size:15px; }
  .total-pts { margin-left:auto; font-weight:700; color:var(--vio); }
  .item { border:1.5px solid var(--bord); border-left:6px solid var(--gc,#8a47c9); border-radius:12px; padding:12px; margin-bottom:12px; background:#fff; }
  .item-tete { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .item-tete .num { background:var(--gc,#8a47c9); }
  .ligne2 { display:grid; grid-template-columns:110px 1fr; gap:10px; }
  .grille2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:640px){ .grille2, .ligne2 { grid-template-columns:1fr; } }
  .item textarea { min-height:60px; }
  .info-box { background:#fff8e6; border:1px solid #efd9a0; border-radius:10px; padding:10px 14px; font-size:15px; line-height:1.4; }
  #lien-eleve { font-size:13px; }
</style>
</head>
<body>
<header>
  <h1 id="titre-page">📝 Évaluation</h1>
  <div class="etapes" id="etapes"></div>
</header>
<main id="app"></main>
<div class="modale" id="modale" hidden><div class="carte" id="modale-contenu"></div></div>
<input type="file" id="fichier" accept=".json,application/json" hidden>

<script>
/* ================================================================================== */
/*  CONFIGURATION PAR DÉFAUT — tu peux aussi tout modifier depuis l'espace enseignant  */
/*  (ouvre cette page avec « ?prof » à la fin de l'adresse)                            */
/* ================================================================================== */
const CFG_DEFAUT = {
  titre: "Évaluation · Yvain, le chevalier au lion",
  sousTitre: "Séance 1 : le roman courtois et son contexte",
  maxCar: 200,
  competence: {
    programme: "Programme de français, cycle 4 · 5ème (arrêté du 18 février 2026, BO n°10 du 5 mars 2026)",
    domaine:   "Lecture – Acquérir, structurer et mobiliser des connaissances littéraires et culturelles",
    principale:"Se constituer des repères dans l’histoire littéraire.",
    secondaire:"Tirer parti des informations sur le contexte de production d’une œuvre pour la comprendre et l’interpréter."
  },
  groupes: { A:"Le roman courtois", B:"L’auteur, les genres et la transmission", C:"Le contexte historique" },
  /* Questions déjà sélectionnées et classées de la plus à la moins importante sur le plan littéraire.
     g = groupe (A, B ou C) · pts = points · rep = réponse attendue (pour mémoire)
     motsCles = correction automatique : chaque sous-liste est un élément attendu, réussi si l'un de ses mots apparaît. */
  items: [
    {id:'l1', g:'A', pts:2, txt:"De quel genre Chrétien de Troyes est-il le créateur ?",
       rep:"Le roman courtois.", motsCles:[["roman"]]},
    {id:'l2', g:'A', pts:2, txt:"Qu’appelle-t-on le roman courtois ? (que raconte-t-il ?)",
       rep:"Un récit qui raconte les aventures d’un chevalier amoureux de sa dame.", motsCles:[["aventure"],["chevalier"],["dame","amour"]]},
    {id:'l3', g:'A', pts:2, txt:"Quels personnages le roman courtois met-il en scène ?",
       rep:"Des chevaliers (Lancelot, Perceval) et leurs dames.", motsCles:[["chevalier"],["dame"]]},
    {id:'l4', g:'A', pts:2, txt:"Qu’appelle-t-on le roman courtois ? (dans quelle langue est-il écrit ?)",
       rep:"Un récit écrit en langue romane.", motsCles:[["romane","francais"]]},
    {id:'l5', g:'A', pts:2, txt:"Pourquoi peut-on dire que Yvain, le chevalier au lion a eu un succès durable ?",
       rep:"Il s’est diffusé dans toute l’Europe et a inspiré de nombreux auteurs et artistes.", motsCles:[["europe"],["inspir","influenc","artiste","auteur","modele"]]},
    {id:'c5', g:'B', pts:1, txt:"Quels sont les deux genres populaires à l’époque de Chrétien de Troyes ?",
       rep:"La chanson de geste et le roman (courtois).", motsCles:[["geste"],["roman"]]},
    {id:'c6', g:'B', pts:1, txt:"De quelle manière les textes se transmettent-ils ? Comment désigne-t-on ceux qui les racontent ?",
       rep:"À l’oral ; ce sont les troubadours.", motsCles:[["oral","voix","chant","lecture","lisent"],["troubadour"]]},
    {id:'c7', g:'B', pts:1, txt:"Pourquoi les moines ont-ils un rôle important ?",
       rep:"Ils recopient les œuvres à la main (copistes) afin d’assurer leur diffusion.", motsCles:[["copi","recopi"],["diffus","manuscrit","transmet","conserv","main"]]},
    {id:'l6', g:'B', pts:1, txt:"Chrétien de Troyes était un clerc : que désigne ce terme ?",
       rep:"Un homme instruit qui sait lire et écrire le latin, souvent lié au clergé.", motsCles:[["instruit","savant","lettre","sait lire","lire"],["ecrire","latin","clerge","eglise"]]},
    {id:'l7', g:'B', pts:1, txt:"Quelles personnes puissantes Chrétien de Troyes a-t-il servies ?",
       rep:"Marie, comtesse de Champagne, et Philippe d’Alsace, comte de Flandre.", motsCles:[["marie","champagne"],["philippe","alsace","flandre"]]},
    {id:'l8', g:'B', pts:1, txt:"Quelles autres œuvres Chrétien de Troyes a-t-il écrites ?",
       rep:"Lancelot ou le chevalier de la charrette, Perceval ou le conte du Graal.", motsCles:[["lancelot"],["perceval"]]},
    {id:'c1', g:'C', pts:1, txt:"Qu’appelle-t-on le système féodal ?",
       rep:"Des liens de fidélité entre un seigneur (suzerain) et son vassal : le vassal se place sous la protection du suzerain.", motsCles:[["vassal"],["suzerain","seigneur"],["fidelite","protection","lien","serment","hommage"]]},
    {id:'c2', g:'C', pts:1, txt:"À quelle période cette œuvre a-t-elle été écrite ?",
       rep:"Au XIIe siècle.", motsCles:[["xii","12","douzi"]]},
    {id:'c3', g:'C', pts:1, txt:"Quelle était l’importance de la religion chrétienne à cette époque ?",
       rep:"Elle est très importante : elle rythme la vie des gens.", motsCles:[["important","rythme","quotidien","chaque","vie","partout"]]},
    {id:'c4', g:'C', pts:1, txt:"Quel adjectif désigne les langues venues du latin comme le français ?",
       rep:"Romanes.", motsCles:[["roman"]]}
  ]
};
const COUL = {A:'#8a47c9', B:'#2f6fd6', C:'#1f9d63'};

/* ---------------- Outils ---------------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
                del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const slug = s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const norm = s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’']/g,' ');
const fmt = x=>String(x).replace('.',',');
const clone = o=>JSON.parse(JSON.stringify(o));
const hash = s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); };
function b64u(bytes){ let s=''; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t), o=new Uint8Array(s.length); for(let i=0;i<s.length;i++) o[i]=s.charCodeAt(i); return o; }
const b64e = s=>b64u(new TextEncoder().encode(s));
async function fluxVersOctets(flux){ return new Uint8Array(await new Response(flux).arrayBuffer()); }
async function encoderCfg(cfg){
  const bytes = new TextEncoder().encode(JSON.stringify(cfg));
  if (window.CompressionStream){
    const cs = new CompressionStream('deflate-raw'), w = cs.writable.getWriter(); w.write(bytes); w.close();
    return 'z' + b64u(await fluxVersOctets(cs.readable));
  }
  return 'j' + b64u(bytes);
}
async function decoderCfg(txt){
  let bytes = unb64u(txt.slice(1));
  if (txt[0]==='z'){
    const ds = new DecompressionStream('deflate-raw'), w = ds.writable.getWriter(); w.write(bytes); w.close();
    bytes = await fluxVersOctets(ds.readable);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
/* Vérifie et nettoie une configuration (importée ou décodée) */
function nettoyerCfg(c){
  if (!c || !Array.isArray(c.items) || !c.items.length) throw new Error('configuration vide');
  const d = CFG_DEFAUT, txt = (v,def)=>typeof v==='string' ? v : def;
  const out = {
    titre: txt(c.titre,d.titre), sousTitre: txt(c.sousTitre,d.sousTitre),
    maxCar: Math.min(500, Math.max(20, Number(c.maxCar)||d.maxCar)),
    competence: {}, groupes: {},
    items: c.items.slice(0,40).map((it,i)=>({
      id: txt(it.id,'q'+i) || ('q'+i), g: ['A','B','C'].includes(it.g) ? it.g : 'A',
      pts: Math.max(0, Math.round((Number(it.pts)||0)*4)/4), txt: txt(it.txt,''), rep: txt(it.rep,''),
      motsCles: (Array.isArray(it.motsCles)?it.motsCles:[]).map(g=>(Array.isArray(g)?g:[]).map(String).filter(x=>x.trim())).filter(g=>g.length)
    }))
  };
  Object.keys(d.competence).forEach(k=>out.competence[k] = txt((c.competence||{})[k], d.competence[k]));
  ['A','B','C'].forEach(k=>out.groupes[k] = txt((c.groupes||{})[k], d.groupes[k]));
  return out;
}

/* ---------------- Configuration active ---------------- */
let CFG, ITEMS, NB, TOTAL, MAX_CAR, COMPETENCE, S, CLE;
function appliquerCfg(cfg){
  CFG = cfg; ITEMS = cfg.items; NB = ITEMS.length; TOTAL = ITEMS.reduce((s,i)=>s+i.pts,0);
  MAX_CAR = cfg.maxCar; COMPETENCE = cfg.competence;
  CLE = 'eval-yvain-seance1-v4:' + hash(JSON.stringify(ITEMS.map(i=>[i.id,i.txt,i.pts])));
  S = store.get(CLE) || {etape:0, nom:'', prenom:'', classe:'', rep:{}};
  S.rep = S.rep || {};
  $('#titre-page').textContent = '📝 ' + cfg.titre;
  document.title = cfg.titre;
}
const sauver = ()=>store.set(CLE,S);
const nomGroupe = g=>CFG.groupes[g];

/* ---------------- Correction automatique ---------------- */
function fraction(it, texte){
  if (!it.motsCles.length) return null;                 // pas de mots-clés : à corriger à la main
  const t = norm(texte||''); if(!t.trim()) return 0;
  const ok = it.motsCles.filter(groupe=>groupe.some(m=>t.includes(norm(m).trim()))).length;
  return ok / it.motsCles.length;
}
function evaluer(rep){
  const r = x=>Math.round(x*2)/2;
  const fr = ITEMS.map(it=>fraction(it,(rep||{})[it.id]));
  const parG = {A:0,B:0,C:0}, maxG = {A:0,B:0,C:0};
  ITEMS.forEach((it,i)=>{ parG[it.g]+=(fr[i]||0)*it.pts; maxG[it.g]+=it.pts; });
  const pg = {A:r(parG.A), B:r(parG.B), C:r(parG.C)};
  return {fr, pg, maxG, total:pg.A+pg.B+pg.C, justes:fr.filter(x=>x!==null&&x>=.99).length, manuelles:fr.filter(x=>x===null).length};
}

/* ====================== ESPACE ÉLÈVE ====================== */
const ETAPES = ['1 · Qui es-tu ?','2 · Répondre','3 · Rendre'];
function rendreEtapes(){ $('#etapes').innerHTML = ETAPES.map((t,i)=>'<span class="etape'+(i===S.etape?' on':'')+'">'+t+'</span>').join(''); }
function aller(n){ S.etape=n; sauver(); render(); window.scrollTo(0,0); }
function enteteCompetence(){
  return '<div class="comp"><strong>Compétence travaillée</strong> — '+esc(COMPETENCE.domaine)+'<br>« '+esc(COMPETENCE.principale)+' »<br>'
    +'<span class="aide">'+esc(COMPETENCE.programme)+'</span></div>';
}
const ptsTxt = n=>fmt(n)+(n>1?' points':' point');
function render(){
  rendreEtapes();
  const app = $('#app');
  if (S.etape===0){
    app.innerHTML = '<div class="carte"><h2>'+esc(CFG.sousTitre)+'</h2>'
      +'<p>Tu vas répondre à <strong>'+NB+' questions</strong> issues de la carte mentale, <strong>en tapant tes réponses</strong>. Les questions sont classées de la plus importante à la moins importante pour comprendre le roman courtois : les premières peuvent rapporter plus de points.</p>'
      + enteteCompetence()
      +'<label>Nom <input type="text" id="nom" autocomplete="family-name" value="'+esc(S.nom)+'"></label>'
      +'<label>Prénom <input type="text" id="prenom" autocomplete="given-name" value="'+esc(S.prenom)+'"></label>'
      +'<label>Classe <input type="text" id="classe" value="'+esc(S.classe)+'" placeholder="ex. 5e B"></label>'
      +'<p class="msg" id="msg"></p><div class="barre-actions"><button class="prim" id="go">Commencer</button></div></div>';
    $('#go').onclick = ()=>{
      S.nom=$('#nom').value.trim(); S.prenom=$('#prenom').value.trim(); S.classe=$('#classe').value.trim();
      if(!S.nom||!S.prenom||!S.classe){ $('#msg').textContent='Écris ton nom, ton prénom et ta classe.'; return; }
      aller(1);
    };
  } else if (S.etape===1){
    app.innerHTML = '<div class="carte"><h2>Tape tes réponses</h2>'
      +'<p>Réponds à chaque question par une phrase courte. <span class="aide">(Maximum '+MAX_CAR+' caractères par réponse.)</span></p>'
      +'<div id="reponses"></div>'
      +'<div class="barre-actions"><button id="retour">← Retour</button><span class="compteur" id="cpt"></span><button class="prim" id="suite">Terminer →</button></div></div>';
    const zone = $('#reponses');
    ITEMS.forEach((it,i)=>{
      const d = document.createElement('div'); d.className='qrep'+((S.rep[it.id]||'').trim()?' fait':'');
      d.innerHTML = '<div class="q"><div class="num">'+(i+1)+'</div><div>'+esc(it.txt)+'</div><div class="pts">'+ptsTxt(it.pts)+'</div></div>'
        +'<textarea maxlength="'+MAX_CAR+'" spellcheck="false" autocorrect="off" autocomplete="off" aria-label="Réponse à la question '+(i+1)+'" placeholder="Ta réponse…"></textarea>';
      const ta = d.querySelector('textarea'); ta.value = S.rep[it.id]||'';
      ta.addEventListener('input',()=>{ S.rep[it.id]=ta.value; d.classList.toggle('fait',!!ta.value.trim()); maj(); sauver(); });
      zone.appendChild(d);
    });
    const maj = ()=>{ $('#cpt').textContent = ITEMS.filter(it=>(S.rep[it.id]||'').trim()).length+' / '+NB+' répondues'; };
    maj();
    $('#retour').onclick = ()=>aller(0);
    $('#suite').onclick = ()=>aller(2);
  } else {
    const vides = ITEMS.filter(it=>!(S.rep[it.id]||'').trim()).length;
    app.innerHTML = '<div class="carte"><h2>Rendre mon travail</h2>'
      +'<p>Relis tes réponses : tu ne pourras plus les modifier une fois le PDF créé.</p>'
      +(vides?'<p class="msg">⚠ Il reste '+vides+' question'+(vides>1?'s':'')+' sans réponse.</p>':'')
      +'<ol style="padding-left:24px;line-height:1.4">'+ITEMS.map(it=>'<li><strong>'+esc(it.txt)+'</strong><br><span style="color:var(--vio)">'+(esc(S.rep[it.id]||'').trim()||'<em style="color:var(--err)">— pas de réponse —</em>')+'</span></li>').join('')+'</ol>'
      +'<div class="barre-actions"><button id="retour">← Revenir aux réponses</button><button class="prim" id="pdf" style="margin-left:auto">📤 Créer mon PDF</button></div></div>';
    $('#retour').onclick = ()=>aller(1);
    $('#pdf').onclick = creerRendu;
  }
}

/* ---------------- PDF : A4 recto-verso (2 pages maximum) ---------------- */
function chargerScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('chargement '+src)); document.head.appendChild(s); }); }
async function bibliotheques(){
  if (!window.html2canvas) await chargerScript('lib/html2canvas.min.js');
  if (!window.jspdf) await chargerScript('lib/jspdf.umd.min.js');
}
const PH = 1123, PIED = 54;
const PAGE_CSS = 'position:absolute;left:-10000px;top:0;width:794px;height:'+PH+'px;background:#fff;color:#1d1a24;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:30px 40px;box-sizing:border-box;overflow:hidden;';

function ligneHTML(i, ev, fs){
  const it = ITEMS[i], f = ev.fr[i], coul = COUL[it.g];
  const rm = f===null ? ['?','#6c6379'] : f>=.99 ? ['✓','#1f9d63'] : f>0 ? ['≈','#e0862a'] : ['✗','#d11a1a'];
  const texte = (S.rep[it.id]||'').trim();
  const gagne = f===null ? '…' : fmt(Math.round(f*it.pts*2)/2);
  return '<div style="display:flex;gap:9px;align-items:stretch;margin-bottom:6px">'
    +'<div style="flex:0 0 30px;background:'+coul+';color:#fff;font-weight:700;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px">'+(i+1)+'</div>'
    +'<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:'+fs+'px;line-height:1.22">'+esc(it.txt)+'</div>'
    +'<div style="font-size:'+fs+'px;line-height:1.25;margin-top:2px;'+(texte?'color:#2a3f8f':'color:#b0283a;font-style:italic')+'">'+(texte?esc(texte):'— pas de réponse —')+'</div></div>'
    +'<div style="flex:0 0 74px;text-align:right;line-height:1.35"><div style="font-size:19px;font-weight:700;color:'+rm[1]+'">'+rm[0]+'</div>'
    +'<div style="font-size:11.5px;color:#6c6379">'+gagne+' / '+fmt(it.pts)+'</div></div></div>';
}
function pageRecto(ev, rows){
  const date = new Date().toLocaleDateString('fr-FR');
  return '<div style="'+PAGE_CSS+'">'

    +  '<div style="font-size:34px;font-weight:800;color:#6a3fb5;line-height:1.1">'+fmt(ev.total)+'<span style="font-size:18px"> / '+fmt(TOTAL)+'</span></div></div></div>'

    +'<div id="rows">'+rows+'</div>'

}
function pageVerso(ev, rows){
  const cases = ['Maîtrise insuffisante','Maîtrise fragile','Maîtrise satisfaisante','Très bonne maîtrise']
    .map(t=>'<div style="flex:1;border:1.5px solid #8a8396;border-radius:8px;padding:7px 4px;text-align:center;font-size:11.5px"><div style="width:14px;height:14px;border:1.5px solid #333;border-radius:3px;margin:0 auto 4px"></div>'+t+'</div>').join('');
  const ligneG = g=>{
    const nums = ITEMS.map((it,i)=>it.g===g?i+1:null).filter(x=>x);
    if (!nums.length) return '';
    return '<tr><td style="padding:6px 8px;border:1px solid #cfc7dc;font-weight:700;font-size:13px;color:'+COUL[g]+'">'+esc(nomGroupe(g))+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #cfc7dc;font-size:12px;color:#6c6379">Questions '+nums.join(', ')+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #cfc7dc;text-align:center;font-weight:800;font-size:16px;width:90px;color:#6a3fb5">'+fmt(ev.pg[g])+' / '+fmt(ev.maxG[g])+'</td></tr>';
  };
  return '<div style="'+PAGE_CSS+'">'
    +'<div id="rows">'+rows+'</div>'
    +'<div id="bilan" style="margin-top:8px">'
    +'<div style="font-size:17px;font-weight:800;margin-bottom:5px">Bilan de l’évaluation · '+esc(S.prenom+' '+S.nom.toUpperCase())+' · '+esc(S.classe)+'</div>'
    +'<table style="width:100%;border-collapse:collapse">'+ligneG('A')+ligneG('B')+ligneG('C')
    +'<tr><td colspan="2" style="padding:6px 8px;border:1px solid #cfc7dc;text-align:right;font-weight:700;font-size:13px">'+ev.justes+' réponses justes sur '+NB+(ev.manuelles?' ('+ev.manuelles+' à corriger à la main)':'')+' · Note automatique · note retenue par le professeur : ………… / '+fmt(TOTAL)+'</td>'
    +'<td style="padding:6px 8px;border:1px solid #cfc7dc;text-align:center;font-weight:800;font-size:18px;background:#f3edff;color:#6a3fb5">'+fmt(ev.total)+' / '+fmt(TOTAL)+'</td></tr></table>'
    +'<div style="font-weight:700;font-size:12.5px;margin:9px 0 4px">Niveau de maîtrise de la compétence « '+esc(COMPETENCE.principale)+' »</div>'
    +'<div style="display:flex;gap:7px">'+cases+'</div>'
    +'<div style="font-weight:700;font-size:12.5px;margin:9px 0 4px">Appréciation du professeur</div>'
    +'<div id="appr" style="border:1.5px solid #8a8396;border-radius:10px;min-height:70px;background-image:repeating-linear-gradient(transparent,transparent 29px,#d5cfe0 29px,#d5cfe0 30px)"></div>'
    +'</div>'
    +'<div style="position:absolute;bottom:20px;left:40px;right:40px;font-size:10.5px;color:#6c6379;display:flex;justify-content:space-between"><span>Signature de l’élève : ………………… · Signature des parents : …………………</span><span>Verso</span></div>'
    +'</div>';
}
/* Choisit la taille de police et la coupure recto/verso pour que tout tienne sur 2 pages */
function composerPages(ev){
  const monter = h=>{ const d=document.createElement('div'); d.innerHTML=h; const el=d.firstChild; document.body.appendChild(el); return el; };
  for (const fs of [13,12.5,12,11.5,11,10.5,10,9.5]){
    const lignes = ITEMS.map((_,i)=>ligneHTML(i,ev,fs));
    for (let k=NB; k>=0; k--){
      const a = monter(pageRecto(ev, lignes.slice(0,k).join('')));
      const rows1 = a.querySelector('#rows');
      if (rows1.offsetTop + rows1.offsetHeight > PH - PIED){ a.remove(); continue; }
      const b = monter(pageVerso(ev, lignes.slice(k).join('')));
      const appr = b.querySelector('#appr');
      if (appr.offsetTop + appr.offsetHeight <= PH - PIED){
        appr.style.height = Math.max(70, PH - PIED - appr.offsetTop - 2) + 'px';
        return {a, b, fs, k};
      }
      a.remove(); b.remove();
    }
  }
  throw new Error('mise en page impossible');
}
async function genererPDF(){
  await bibliotheques();
  const ev = evaluer(S.rep);
  const data = {type:'evaluation-yvain-seance1', version:4, titre:CFG.titre, eleve:{nom:S.nom,prenom:S.prenom,classe:S.classe}, date:new Date().toISOString(),
                reponses:ITEMS.map(it=>({id:it.id, texte:(S.rep[it.id]||'').trim()})), note:ev.total, total:TOTAL, detail:ev.pg};
  const pdf = new jspdf.jsPDF({orientation:'portrait', unit:'mm', format:'a4', compress:true});
  const {a, b, fs, k} = composerPages(ev);
  try {
    for (const [idx, el] of [a,b].entries()){
      const canvas = await html2canvas(el,{scale:2, backgroundColor:'#ffffff', logging:false});
      if (idx>0) pdf.addPage('a4','portrait');
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    }
  } finally { a.remove(); b.remove(); }
  pdf.setProperties({title:'Évaluation de '+S.prenom+' '+S.nom, keywords:'YVEVAL4.'+b64e(JSON.stringify(data))+'.FIN'});
  return {blob:pdf.output('blob'), pages:pdf.getNumberOfPages(), ev, fs, k};
}

/* ====================== ESPACE ENSEIGNANT ====================== */
const CLE_BROUILLON = 'eval-yvain-seance1-prof';
let brouillon = null;     // configuration en cours d'édition
const sauverBrouillon = ()=>{ store.set(CLE_BROUILLON, brouillon); majTotal(); };
const motsVersTexte = mc=>mc.map(g=>g.join(', ')).join('\n');
const texteVersMots = t=>t.split('\n').map(l=>l.split(/[,;]/).map(x=>x.trim()).filter(Boolean)).filter(g=>g.length);
function majTotal(){ const el=$('#total-pts'); if(el){ const t=brouillon.items.reduce((s,i)=>s+(Number(i.pts)||0),0); el.textContent='Total : '+fmt(t)+' points · '+brouillon.items.length+' questions'; } }

function renderProf(){
  $('#etapes').innerHTML = '<span class="etape on">✏️ Espace enseignant</span>';

    '<div class="info-box"><strong>Ici, tu modifies l’évaluation.</strong> Tes changements sont gardés sur cet appareil. Pour les donner aux élèves : <strong>« Copier le lien élève »</strong> (ils ouvrent ce lien) ou <strong>« Exporter »</strong> pour garder un fichier. L’adresse normale de la page, sans « ?prof », reste la version d’origine.</div>'
    +'<div class="prof-barre">'
    +  '<button class="prim" id="b-lien">🔗 Copier le lien élève</button>'
    +  '<button id="b-test">👀 Tester comme élève</button>'
    +  '<button id="b-page">📐 Vérifier la mise en page</button>'
    +  '<button id="b-export">💾 Exporter</button>'
    +  '<button id="b-import">📂 Ouvrir</button>'
    +  '<button id="b-reset">↺ Version d’origine</button>'
    +  '<span class="total-pts" id="total-pts"></span>'
    +'</div>'
    +'<div class="carte"><h2>Titre et compétence</h2>'
    +  '<label>Titre <input type="text" data-k="titre"></label>'
    +  '<label>Sous-titre <input type="text" data-k="sousTitre"></label>'
    +  '<label>Compétence principale <input type="text" data-c="principale"></label>'
    +  '<label>Compétence d’appui <input type="text" data-c="secondaire"></label>'
    +  '<label>Domaine du programme <input type="text" data-c="domaine"></label>'
    +  '<label>Référence du programme <input type="text" data-c="programme"></label>'
    +  '<div class="grille2"><label>Groupe A (violet) <input type="text" data-g="A"></label><label>Groupe B (bleu) <input type="text" data-g="B"></label></div>'
    +  '<div class="grille2"><label>Groupe C (vert) <input type="text" data-g="C"></label><label>Longueur maximale d’une réponse (caractères) <input type="number" min="20" max="500" step="10" data-k="maxCar"></label></div>'
    +'</div>'
    +'<h2 style="margin:6px 0 10px">Questions (dans l’ordre de l’évaluation)</h2>'
    +'<div class="aide" style="margin-bottom:10px">Chaque question a une réponse attendue et des <strong>mots-clés</strong> pour la correction automatique : <em>une ligne = un élément attendu ; les mots d’une même ligne sont des variantes séparées par des virgules ; la ligne est réussie si l’un d’eux apparaît dans la réponse</em> (accents et majuscules ignorés ; une racine suffit : « copi » trouve copie et copiste). Sans mots-clés, la question est à corriger à la main.</div>'
    +'<div id="items"></div>'
    +'<div class="barre-actions"><button class="prim" id="b-ajout">＋ Ajouter une question</button></div>';
  // champs simples
  app.querySelectorAll('[data-k]').forEach(i=>{ i.value=c[i.dataset.k]; i.oninput=()=>{ c[i.dataset.k]=i.type==='number'?Number(i.value):i.value; sauverBrouillon(); }; });
  app.querySelectorAll('[data-c]').forEach(i=>{ i.value=c.competence[i.dataset.c]; i.oninput=()=>{ c.competence[i.dataset.c]=i.value; sauverBrouillon(); }; });
  app.querySelectorAll('[data-g]').forEach(i=>{ i.value=c.groupes[i.dataset.g]; i.oninput=()=>{ c.groupes[i.dataset.g]=i.value; sauverBrouillon(); }; });
  dessinerItems();

  $('#b-ajout').onclick = ()=>{ c.items.push({id:'q'+Date.now().toString(36), g:'B', pts:1, txt:'', rep:'', motsCles:[]}); sauverBrouillon(); dessinerItems(); const l=document.querySelectorAll('.item'); l[l.length-1].scrollIntoView({behavior:'smooth',block:'center'}); };
  $('#b-lien').onclick = copierLien;

function dessinerItems(){
  const zone = $('#items'); zone.innerHTML='';
  brouillon.items.forEach((it,i)=>{
    const d = document.createElement('div'); d.className='item'; d.style.setProperty('--gc',COUL[it.g]);
    d.innerHTML =
      '<div class="item-tete"><div class="num">'+(i+1)+'</div><strong style="flex:1">Question '+(i+1)+'</strong>'
      +'<button class="petit" data-a="haut" '+(i===0?'disabled':'')+' aria-label="Monter">▲</button>'
      +'<button class="petit" data-a="bas" '+(i===brouillon.items.length-1?'disabled':'')+' aria-label="Descendre">▼</button>'
      +'<button class="petit" data-a="suppr" aria-label="Supprimer">🗑</button></div>'
      +'<label>Question posée à l’élève <textarea data-f="txt"></textarea></label>'
      +'<div class="ligne2"><label>Points <input type="number" min="0" step="0.5" data-f="pts"></label>'
      +'<label>Groupe <select data-f="g"><option value="A">A · '+esc(brouillon.groupes.A)+'</option><option value="B">B · '+esc(brouillon.groupes.B)+'</option><option value="C">C · '+esc(brouillon.groupes.C)+'</option></select></label></div>'
      +'<div class="grille2"><label>Réponse attendue (pour mémoire) <textarea data-f="rep"></textarea></label>'
      +'<label>Mots-clés (une ligne = un élément attendu) <textarea data-f="mots" placeholder="ex.&#10;chevalier&#10;dame, amour"></textarea></label></div>';
    d.querySelector('[data-f=txt]').value = it.txt; d.querySelector('[data-f=pts]').value = it.pts;
    d.querySelector('[data-f=g]').value = it.g; d.querySelector('[data-f=rep]').value = it.rep; d.querySelector('[data-f=mots]').value = motsVersTexte(it.motsCles);
    d.querySelectorAll('[data-f]').forEach(inp=>{
      inp.oninput = ()=>{
        const f = inp.dataset.f;
        if (f==='pts') it.pts = Number(inp.value)||0;
        else if (f==='mots') it.motsCles = texteVersMots(inp.value);
        else if (f==='g'){ it.g = inp.value; d.style.setProperty('--gc',COUL[it.g]); }
        else it[f] = inp.value;
        sauverBrouillon();
      };
    });
    d.querySelectorAll('[data-a]').forEach(b=>b.onclick = ()=>{
      const a = b.dataset.a, L = brouillon.items;
      if (a==='haut' && i>0) [L[i-1],L[i]]=[L[i],L[i-1]];
      else if (a==='bas' && i<L.length-1) [L[i+1],L[i]]=[L[i],L[i+1]];
      else if (a==='suppr'){ if(!confirm('Supprimer la question '+(i+1)+' ?')) return; L.splice(i,1); }
      sauverBrouillon(); dessinerItems();
    });
    zone.appendChild(d);
  });
}
async function copierLien(){
  try {
    const h = await encoderCfg(nettoyerCfg(brouillon));
    const url = location.origin + location.pathname + '#c=' + h;
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch(e){}
    modale('<h2>'+(ok?'✅ Lien copié':'Lien élève')+'</h2><p>Donne ce lien aux élèves (par exemple à coller dans École Directe). Ils ouvriront ton évaluation modifiée.</p>'
      +'<textarea id="lien-eleve" readonly style="min-height:110px">'+esc(url)+'</textarea>'
      +'<p class="aide">'+url.length+' caractères. Les réponses attendues et les mots-clés sont contenus dans ce lien : un élève très curieux pourrait les retrouver.</p>'
      +'<div class="barre-actions"><button class="prim" id="ferme">Fermer</button></div>');
    $('#lien-eleve').onfocus = e=>e.target.select(); $('#ferme').onclick = fermerModale;
  } catch(e){ modale('<h2>Lien impossible</h2><p>'+esc(e.message)+'</p><div class="barre-actions"><button id="ferme">Fermer</button></div>'); $('#ferme').onclick = fermerModale; }
}
function exporter(){
  const blob = new Blob([JSON.stringify(brouillon,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'evaluation-yvain-seance1.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('#fichier').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;

  e.target.value='';
});

}

/* ====================== DÉMARRAGE ====================== */
(async function demarrer(){
  const prof = /(^|[?&])prof(=|&|$)/.test(location.search);
  const m = /[#&]c=([A-Za-z0-9_-]+)/.exec(location.hash);
  let cfg = null, erreur = '';
  if (m){ try { cfg = nettoyerCfg(await decoderCfg(m[1])); } catch(e){ erreur = 'Le lien de l’évaluation est incomplet ou abîmé : la version d’origine est affichée.'; } }
  if (prof){
    let b = store.get(CLE_BROUILLON);
    try { brouillon = b ? nettoyerCfg(b) : (cfg || clone(CFG_DEFAUT)); } catch(e){ brouillon = clone(CFG_DEFAUT); }
    appliquerCfg(clone(brouillon));
    renderProf();
    return;
  }
  appliquerCfg(cfg || clone(CFG_DEFAUT));
  render();
  if (erreur) $('#app').insertAdjacentHTML('afterbegin','<div class="info-box" style="margin-bottom:12px">'+esc(erreur)+'</div>');
})();
