<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analyse Héroïque - Moteur Complet</title>
    <style>
        :root {
            --subject-color: #3498DB;
            --cod-color: #27AE60;
            --coi-color: #E67E22;
            --selected-bg: #D6EAF8;
            --verb-highlight: #FADBD8;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #F4F7F6;
            margin: 0; padding: 20px;
            touch-action: manipulation;
            -webkit-user-select: none;
        }

        #app { max-width: 900px; margin: 0 auto; padding-bottom: 220px; }

        #instruction-header {
            background: #2C3E50; color: white; padding: 20px;
            border-radius: 12px; margin-bottom: 20px; border-left: 6px solid var(--subject-color);
        }

        #sentence-box {
            background: white; padding: 60px 40px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            line-height: 3.5; font-size: 1.3rem; text-align: center; min-height: 150px;
            overflow: visible; position: relative;
        }

        .word {
            display: inline-block; padding: 4px 8px; margin: 0 2px;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
            position: relative; z-index: 1;
        }

        .word.selected { background-color: var(--selected-bg); box-shadow: 0 0 0 2px var(--subject-color); }

        /* Animation de glissement et disparition pour le CC */
        @keyframes slideAndFade {
            0% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(100px); opacity: 0.7; color: #95A5A6; }
            100% { transform: translateX(200px); opacity: 0; }
        }

        .cc-slide-out {
            animation: slideAndFade 1.2s forwards;
            pointer-events: none;
        }

        .word.hidden { display: none !important; }

        .pulse-verb { animation: pulse 0.6s ease-in-out 3; background-color: var(--verb-highlight) !important; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* Interface de contrôle */
        #control-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 20px; border-top: 1px solid #D5DBDB;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); z-index: 100;
        }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        button {
            height: 75px; border: none; border-radius: 12px;
            color: white; font-weight: bold; font-size: 0.85rem; cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        .btn-sujet { background: var(--subject-color); }
        .btn-cc { background: #95A5A6; }
        .btn-cod { background: var(--cod-color); }
        .btn-coi { background: var(--coi-color); }
        
        #btn-next { background: #2C3E50; grid-column: span 4; display: none; height: 50px; margin-top: 10px;}

        .status { display: flex; justify-content: space-between; color: #7F8C8D; font-weight: bold; font-size: 0.85rem; }

        #info-toast {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            background: #2C3E50; color: white; padding: 15px 30px;
            border-radius: 40px; display: none; z-index: 1000; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="info-toast">Message</div>

<div id="app">
    <div id="instruction-header">
        <strong>🧪 Laboratoire de Grammaire :</strong> Sélectionne un groupe puis identifie sa fonction.
        <br><strong>Les Sujets et COD se transforment en pronoms, les groupes facultatifs en gris disparaissent .</small>
    </div>

    <div id="sentence-box"></div>

    <div id="control-panel">
        <div class="btn-grid">
            <button class="btn-sujet" onclick="verify('S')">SUJET du verbe<br><small>(Remplacer par un pronom sujet)</small></button>
            <button class="btn-cc" onclick="verify('CC')">Groupe qu'on peut déplacer et supprimer de la phrase<br><small></small></button>
            <button class="btn-cod" onclick="verify('COD')">COD du verbe<br><small>(rémplacé par le pronom le/La/Les)</small></button>
            <button class="btn-coi" onclick="verify('COI')">COI du verbe<br><small>(je pose la question débutant par une préposition suivi de "qui" ou "quoi")</small></button>
        </div>
        <button id="btn-next" onclick="loadNext()">Phrase Suivante ▶</button>
        <div class="status">
            <span id="score-lab">Score : 0</span>
            <span id="target-lab">Restants : 0</span>
        </div>
    </div>
</div>

<script>
const corpusFinal = [
    // BATMAN (3)
    [{text:"Chaque",id:101},{text:"nuit,",id:101},{text:"le",id:1},{text:"héros",id:1},{text:"solitaire",id:1},{text:"surveille",id:0,v:1},{text:"la",id:201},{text:"ville",id:201},{text:"entière",id:201},{text:"avec",id:102},{text:"une",id:102},{text:"vigilance",id:102},{text:"extrême.",id:102}],
    [{text:"Dans",id:103},{text:"la",id:103},{text:"Batcave,",id:103},{text:"Batman",id:2},{text:"examine",id:0,v:1},{text:"les",id:202},{text:"vidéos",id:202},{text:"de",id:202},{text:"surveillance.",id:202}],
    [{text:"Le",id:3},{text:"justicier",id:3},{text:"livre",id:0,v:1},{text:"les",id:203},{text:"criminels",id:203},{text:"au",id:301},{text:"commissaire",id:301},{text:"Gordon.",id:301}],
    // JEANNE D'ARC (3)
    [{text:"Dans",id:104},{text:"le",id:104},{text:"jardin,",id:104},{text:"la",id:4},{text:"jeune",id:4},{text:"bergère",id:4},{text:"entend",id:0,v:1},{text:"des",id:204},{text:"voix",id:204},{text:"mystérieusement.",id:105}],
    [{text:"Jeanne",id:5},{text:"d'Arc",id:5},{text:"parle",id:0,v:1},{text:"au",id:302},{text:"dauphin",id:302},{text:"Charles",id:302},{text:"avec",id:106},{text:"conviction.",id:106}],
    [{text:"En",id:107},{text:"1429,",id:107},{text:"l'armée",id:6},{text:"française",id:6},{text:"libère",id:0,v:1},{text:"la",id:205},{text:"cité",id:205},{text:"d'Orléans.",id:205}],
    // KATNISS (3)
    [{text:"Le",id:7},{text:"Geai",id:7},{text:"Moqueur",id:7},{text:"succède",id:0,v:1},{text:"à",id:303},{text:"sa",id:303},{text:"sœur",id:303},{text:"Prim",id:303},{text:"par",id:108},{text:"amour.",id:108}],
    [{text:"Dans",id:109},{text:"l'arène,",id:109},{text:"Katniss",id:8},{text:"décoche",id:0,v:1},{text:"une",id:206},{text:"flèche",id:206},{text:"enflammée.",id:206}],
    [{text:"L'héroïne",id:9},{text:"du",id:9},{text:"District",id:9},{text:"12",id:9},{text:"protège",id:0,v:1},{text:"ses",id:207},{text:"alliés.",id:207}],
    // HERCULE (3)
    [{text:"Durant",id:110},{text:"ses",id:110},{text:"travaux,",id:110},{text:"Hercule",id:10},{text:"affronte",id:0,v:1},{text:"le",id:208},{text:"lion.",id:208}],
    [{text:"Le",id:11},{text:"demi-dieu",id:11},{text:"obéit",id:0,v:1},{text:"au",id:304},{text:"roi",id:304},{text:"Eurysthée",id:304},{text:"à",id:111},{text:"cause",id:111},{text:"d'Héra.",id:111}],
    [{text:"Hercule",id:12},{text:"nettoie",id:0,v:1},{text:"les",id:209},{text:"écuries",id:209},{text:"en",id:112},{text:"déviant",id:112},{text:"le",id:112},{text:"fleuve.",id:112}]
];

let cursor = 0, targets = 0, points = 0;

function build() {
    const box = document.getElementById('sentence-box');
    box.innerHTML = "";
    const s = corpusFinal[cursor];
    targets = new Set(s.map(w => w.id).filter(id => id > 0)).size;
    updateUI();

    s.forEach(w => {
        const span = document.createElement('span');
        span.className = "word"; span.innerText = w.text + " ";
        span.dataset.id = w.id; if(w.v) span.dataset.v = "1";
        
        span.onclick = () => {
            if(w.id === 0) return;
            const isS = span.classList.contains('selected');
            document.querySelectorAll('.word').forEach(x => x.classList.remove('selected'));
            if(!isS) document.querySelectorAll(`[data-id='${w.id}']`).forEach(x => x.classList.add('selected'));
        };
        box.appendChild(span);
    });
}

function verify(type) {
    const sel = document.querySelector('.word.selected');
    if(!sel) return;
    const id = parseInt(sel.dataset.id);
    let ok = (type==='S' && id>0 && id<100) || (type==='CC' && id>=100 && id<200) || (type==='COD' && id>=200 && id<300) || (type==='COI' && id>=300);

    if(ok) {
        const group = Array.from(document.querySelectorAll(`[data-id='${id}']`));
        const fullText = group.map(el => el.innerText).join(' ').toLowerCase();
        const verbe = document.querySelector('[data-v="1"]');

        if(type==='S') {
            let pronom = "Il";
            if(fullText.match(/jeanne|bergère|héroïne|armée|ville|cité/)) pronom = "Elle";
            if(fullText.match(/les|des/)) pronom = (pronom === "Elle") ? "Elles" : "Ils";
            group.forEach((x, i) => {
                if(i === 0) { x.innerText = pronom + " "; x.style.color = "var(--subject-color)"; }
                else x.classList.add('hidden');
            });
        } 
        
        else if(type==='CC') {
            group.forEach(x => {
                x.classList.add('cc-slide-out');
                setTimeout(() => x.classList.add('hidden'), 1200);
            });
        } 
        
        else if(type==='COD') {
            let pronom = "le ";
            if(fullText.match(/la |une |cité|ville|flèche/)) pronom = "la ";
            if(fullText.match(/les |des |écuries|vidéos|travaux|criminels/)) pronom = "les ";
            if(verbe.innerText.match(/^[aeiouyèéê]/i) && pronom !== "les ") pronom = "l'";

            group.forEach(x => x.classList.add('hidden'));
            const pSpan = document.createElement('span');
            pSpan.innerText = pronom; pSpan.style.color = "var(--cod-color)"; pSpan.style.fontWeight = "bold";
            verbe.parentNode.insertBefore(pSpan, verbe);
        } 
        
        else if(type==='COI') {
            const prep = group[0].innerText.trim().split(' ')[0];
            toast(`${verbe.innerText.toUpperCase()} ${prep.toUpperCase()} QUI / QUOI ?`);
            verbe.classList.add('pulse-verb');
            setTimeout(()=>verbe.classList.remove('pulse-verb'), 1500);
            group.forEach(x => x.style.color = "var(--coi-color)");
        }

        group.forEach(x => { x.classList.remove('selected'); x.onclick=null; x.style.fontWeight="bold"; });
        targets--; points++; updateUI();
        if(targets === 0) document.getElementById('btn-next').style.display="block";
    } else {
        document.getElementById('sentence-box').animate([
            { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }
        ], { duration: 300 });
    }
}

function toast(m) {
    const t = document.getElementById('info-toast'); t.innerText = m;
    t.style.display="block"; setTimeout(()=>t.style.display="none", 3000);
}

function updateUI() {
    document.getElementById('score-lab').innerText = `Score : ${points}`;
    document.getElementById('target-lab').innerText = `Restants : ${targets}`;
}

function loadNext() {
    cursor++;
    if(cursor < corpusFinal.length) {
        document.getElementById('btn-next').style.display="none"; build();
    } else {
        document.getElementById('sentence-box').innerHTML = "<h2>🥇 Mission accomplie, Professeur !</h2><p>Tous les héros ont été analysés.</p>";
        document.getElementById('btn-next').style.display="none";
    }
}

build();
</script>
</body>
</html>
