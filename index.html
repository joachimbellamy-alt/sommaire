<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Pédagogique - M. Bellamy</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --text-dark: #2c3e50;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 { 
            text-align: center; 
            color: var(--text-dark);
            margin-bottom: 40px;
            font-size: 2.2rem;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
            width: 100%;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: white; 
            font-weight: 600; 
            font-size: 1.1rem;
            text-align: center; 
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            filter: brightness(1.1);
        }

        .card i {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        /* Couleurs personnalisées */
        .c6 { background-color: #3498db; }    /* Bleu */
        .c5 { background-color: #27ae60; }    /* Vert */
        .c3 { background-color: #8e44ad; }    /* Violet Latin */
        .hvc { background-color: #d35400; }   /* Orange */
        .aca { background-color: #16a085; }   /* Turquoise */
        .aide { background-color: #c0392b; }  /* Rouge */
        .ebep { background-color: #34495e; }  /* Bleu nuit EBEP */


        footer {
            margin-top: 40px;
            text-align: center;
            font-style: italic;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Mon Espace Pédagogique</h1>
    
    <div class="grid">
        <a href="6eme/index.html" class="card c6"><span>📖</span>Classe de 6ème</a>
        <a href="5eme/index.html" class="card c5"><span>🖋️</span>Classe de 5ème</a>
        <a href="latin/index.html" class="card c3"><span>🏛️</span>Latin (3ème)</a>
        <a href="HVC/index.html" class="card hvc"><span>🤝</span>HVC / Vie de classe</a>
        <a href="Atelier de Culture Antique/index.html" class="card aca"><span>🏺</span>Atelier Culture Antique</a>
        <a href="Aide_francais/index.html" class="card aide"><span>🆘</span>Aide Français (6ème)</a>
        <a href="Espace_EBEP/index.html" class="card ebep"><span>🧩</span>Espace EBEP</a>
    </div>

    <footer>
        "Docendo discimus" — C'est en enseignant que l'on apprend.
    </footer>
</div>

</body>
</html>
