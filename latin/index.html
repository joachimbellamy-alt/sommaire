    <title>Espace Latin - 3ème</title>
    <style>
        /* Couleur distinctive pour le Latin : Violet */
        :root { --couleur-classe: slateblue; }

        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; color: #2c3e50; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; border-top: 10px solid var(--couleur-classe); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        p { text-align: center; font-style: italic; color: #7f8c8d; margin-bottom: 25px; }
        
        .btn { 
            display: flex; justify-content: center; align-items: center; gap: 10px;
            padding: 18px; margin: 12px 0; 
            background: #fff; border: 2px solid var(--couleur-classe); 
            color: var(--couleur-classe); text-decoration: none; 
            border-radius: 8px; font-weight: bold; transition: 0.3s;
        }
        .btn:hover { background: var(--couleur-classe); color: white; transform: scale(1.02); }
        
        .nouveau {
            background: #e74c3c; color: white; font-size: 0.75em;
            padding: 2px 10px; border-radius: 20px; text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .retour { display: block; text-align: center; margin-top: 30px; color: #95a5a6; text-decoration: none; font-weight: bold; }
        .retour:hover { color: var(--couleur-classe); }
