<script>
const DEF = {"profession": ["profession", "Le métier que l'on exerce. Au départ, c'est une <b>déclaration publique</b> : du latin <i>profiteri</i> « déclarer devant tous » (<i>pro</i> « devant » + <i>fateri</i> « avouer, déclarer »)."], "affable": ["affable", "Aimable, qui accueille avec douceur et à qui l'on peut facilement <b>parler</b>. Du latin <i>affabilis</i> (<i>ad</i> « vers » + <i>fari</i> « parler »)."], "fabuleux": ["fabuleux", "Qui appartient aux fables et aux légendes ; par extension, extraordinaire, incroyable. Du latin <i>fabulosus</i>, formé sur <i>fabula</i> « récit »."], "diffamer": ["diffamer", "Dire du mal de quelqu'un pour salir sa <b>réputation</b>. Du latin <i>diffamare</i> (<i>dis-</i> marque la dispersion + <i>fama</i> « la renommée »)."], "telefono": ["telefono / téléphone", "Appareil qui transmet la voix à distance. Mot formé sur le grec : <i>tēle</i> « loin » + <i>phōnē</i> « la voix », un mot de la même famille que <i>φημί</i> « dire »."], "Fabel": ["Fabel", "En allemand, <i>die Fabel</i> désigne une <b>fable</b>, un court récit souvent avec des animaux et une morale. Mot emprunté au latin <i>fabula</i>."], "bhas": ["bhàs (sanskrit)", "Verbe sanskrit qui signifie « parler, raconter ». Le sanskrit, langue ancienne de l'Inde, descend lui aussi de la racine indo-européenne <i>*bheH₂</i>."], "phemi": ["φημί (phêmi)", "Verbe grec qui signifie « je dis, je parle ». On le retrouve dans <i>euphémisme</i>, <i>blasphème</i>, <i>prophète</i> (celui qui dit à l'avance)."], "enfant": ["enfant", "Du latin <i>infans</i> « celui qui ne parle pas encore » : <i>in-</i> « ne… pas » + <i>fari</i> « parler ». Ce mot vient donc du latin, pas du grec."], "infantile": ["infantile", "Qui concerne l'enfant (une maladie infantile) ; qui se comporte comme un enfant, puéril. Du latin <i>infantilis</i>, formé sur <i>infans</i>."], "Fama": ["fama, ae (f.)", "La <b>renommée</b>, la réputation ; aussi la rumeur, ce que l'on dit de quelqu'un. Mots français : <i>fameux, diffamer, infâme</i>."], "Fatum": ["fatum, i (n.)", "Le <b>destin</b> : littéralement « ce qui a été dit » par les dieux (participe de <i>fari</i> « parler »). Mots français : <i>fatal, fatalité</i>."], "Fabula": ["fabula, ae (f.)", "Le <b>récit</b>, l'histoire, la fable : ce que l'on raconte. Mots français : <i>fable, fabuleux, affabulation</i>."], "Famosus": ["famosus, a, um", "<b>Célèbre</b>, dont on parle beaucoup, en bien ou en mal. Formé sur <i>fama</i>. Mots : <i>fameux</i> en français, <i>famous</i> en anglais."], "hablar": ["Réponse : hablar", "En espagnol, <i>hablar</i> signifie « parler ». Il vient du latin <i>fabulari</i> « bavarder, raconter », formé sur <i>fabula</i>. Le <i>f-</i> latin est devenu <i>h-</i> en espagnol."], "famous": ["Réponse : famous", "En anglais, <i>famous</i> signifie « connu, célèbre ». Il vient du latin <i>famosus</i>, par le vieux français."], "fame": ["Réponse : fame", "En anglais, <i>fame</i> signifie « la célébrité, la renommée ». Il vient du latin <i>fama</i>."], "fable": ["Réponse : la fable", "<i>Fabel</i> se traduit par « la fable », comme celles de La Fontaine. Les deux mots viennent du latin <i>fabula</i>."], "rFama": ["fama → la renommée", "Mots français issus de <i>fama</i> : <i>fameux, diffamer, infâme, famé</i> (mal famé)."], "rFatum": ["fatum → le destin", "Mots français issus de <i>fatum</i> : <i>fatal, fatalité, fatalisme</i>."], "rFabula": ["fabula → le récit, la fable", "Mots français issus de <i>fabula</i> : <i>fable, fabuleux, affabulation</i>."], "rFamosus": ["famosus → célèbre", "Mots issus de <i>famosus</i> : <i>fameux</i> en français, <i>famous</i> en anglais."], "euphemisme": ["Réponse : euphémisme", "Figure de style qui adoucit une idée désagréable (« il nous a quittés » pour « il est mort »). Du grec <i>eu</i> « bien » + <i>phêmi</i> « dire » : « dire de manière agréable »."]};
const COL = {"profession": "#d6336c", "affable": "#d6336c", "fabuleux": "#d6336c", "diffamer": "#d6336c", "telefono": "#d6336c", "hablar": "#d6336c", "Fabel": "#1c8fc0", "famous": "#1c8fc0", "fame": "#1c8fc0", "fable": "#1c8fc0", "bhas": "#e8892b", "phemi": "#7b5ea7", "enfant": "#7b5ea7", "infantile": "#7b5ea7", "euphemisme": "#7b5ea7"};
const pop = document.getElementById('pop'), wrap = document.getElementById('wrap');
const items = [...document.querySelectorAll('.w, .b')];
let current = null;
function count() {
  const n = items.filter(w => w.classList.contains('seen')).length;
  document.getElementById('count').textContent = n + ' / ' + items.length + ' découverts';
}
function reveal(el, on) {
  el.classList.toggle('seen', on);
  if (el.classList.contains('b')) {
    el.querySelectorAll('.ans').forEach(a => a.setAttribute('display', on ? 'inline' : 'none'));
    el.querySelectorAll('.ans-hide').forEach(a => a.setAttribute('display', on ? 'none' : 'inline'));
  }
}
function hide() { pop.style.display = 'none'; if (current) current.classList.remove('active'); current = null; }
function show(el) {
  if (current === el) return hide();
  hide(); current = el;
  el.classList.add('active'); reveal(el, true); count();
  const [t, d] = DEF[el.dataset.id];
  pop.style.setProperty('--c', COL[el.dataset.id] || '#d6336c');
  pop.querySelector('h3').textContent = t;
  pop.querySelector('.d').innerHTML = d;
  pop.style.display = 'block';
  const r = el.getBoundingClientRect(), b = wrap.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = r.left - b.left + r.width / 2 - pw / 2;
  x = Math.max(4, Math.min(x, b.width - pw - 4));
  let y = r.bottom - b.top + 8;
  if (r.bottom + ph + 12 > window.innerHeight && r.top - ph - 8 > 0) y = r.top - b.top - ph - 8;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
items.forEach(el => el.addEventListener('click', e => { e.stopPropagation(); show(el); }));
pop.addEventListener('click', e => e.stopPropagation());
pop.querySelector('.x').addEventListener('click', hide);
document.addEventListener('click', hide);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
const allBtn = document.getElementById('all');
allBtn.addEventListener('click', e => {
  e.stopPropagation(); hide();
  const show = allBtn.dataset.on !== '1';
  items.filter(el => el.classList.contains('b')).forEach(el => reveal(el, show));
  allBtn.dataset.on = show ? '1' : '';
  allBtn.textContent = show ? 'Masquer les réponses' : 'Afficher toutes les réponses';
  count();
});
document.getElementById('reset').addEventListener('click', e => {
  e.stopPropagation(); hide(); items.forEach(el => reveal(el, false));
  allBtn.dataset.on = ''; allBtn.textContent = 'Afficher toutes les réponses'; count();
});
count();
</script>
