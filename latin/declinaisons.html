<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabula declinationum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&display=swap">
<style>
/* Layout : une colonne centrée ; panneau de paramètres repliable, puis plateau ou exercice */
:root {
  --bg: #f1f3f7;
  --surface: #ffffff;
  --ink: #1c2333;
  --muted: #5a6377;
  --line: #d6dbe5;
  --accent: #2b4fa8;
  --accent-soft: #e4eafb;
  --good: #1d7a4b;
  --good-soft: #e1f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --d1: #a86c12;
  --d2: #2b4fa8;
  --d3p: #167a74;
  --d3i: #7a3f8f;
  --d4: #4f6b1a;
  --d5: #5b6274;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  /* Plateau façon Jeopardy : même univers bleu nuit et or dans les deux thèmes */
  --jb-ground: #050c45;
  --jb-tile: #1029a8;
  --jb-tile-edge: #0a1a78;
  --jb-back: #f7f3e3;
  --jb-back-ink: #10194f;
  --jb-red: #b0261b;
  --jb-gold: #f5c542;
  --jb-label: #c9d3ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141c; --surface: #1a1f2d; --ink: #e8ebf2; --muted: #9aa3b8; --line: #2e3548;
    --accent: #8aa6f2; --accent-soft: #232c47; --good: #52c58e; --good-soft: #17322a;
    --bad: #f27a6f; --bad-soft: #3a1f22; --d1: #e2ae4d; --d2: #8aa6f2; --d3p: #4fc6bf; --d3i: #c695da;
    --d4: #a6c46a; --d5: #aab2c6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141c; --surface: #1a1f2d; --ink: #e8ebf2; --muted: #9aa3b8; --line: #2e3548;
  --accent: #8aa6f2; --accent-soft: #232c47; --good: #52c58e; --good-soft: #17322a;
  --bad: #f27a6f; --bad-soft: #3a1f22; --d1: #e2ae4d; --d2: #8aa6f2; --d3p: #4fc6bf; --d3i: #c695da;
  --d4: #a6c46a; --d5: #aab2c6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding: 24px 16px 48px;
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.2rem); letter-spacing: .06em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 100%; font-weight: 700; }
.chip {
  font: inherit; font-size: .95rem; padding: 7px 14px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: var(--accent-soft); font-weight: 700; }
.chip:focus-visible, .btn:focus-visible, .slot:focus-visible, .end:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Panneau de paramètres */
details.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
details.panel > summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
.settings { display: flex; flex-direction: column; gap: 18px; padding-bottom: 20px; }
.models-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; width: 100%; }
.models-pick label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.link-row { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
.link-row input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: .9rem; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.note { font-size: .88rem; color: var(--muted); margin: 0; width: 100%; }
.warn { color: var(--bad); font-weight: 700; font-size: .9rem; margin: 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--line); }
.tab { font: inherit; font-weight: 700; padding: 10px 16px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.progress { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.game-view { display: flex; flex-direction: column; gap: 20px; }

.tablet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.lemma { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.lemma .w { font-size: clamp(1.7rem, 6vw, 2.3rem); font-weight: 700; }
.lemma .g { font-style: italic; color: var(--muted); font-size: 1.2rem; }
.lemma .sens { color: var(--muted); font-size: 1.05rem; width: 100%; }
.badge { font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: var(--c); border: 2px solid var(--c); }

.tbl-wrap { overflow-x: auto; }
table.decl { border-collapse: separate; border-spacing: 6px; margin: -6px; width: calc(100% + 12px); }
table.decl th { font-family: var(--display); font-weight: 700; font-size: .85rem; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 0 4px; }
table.decl thead th { text-align: center; }
table.decl td { background: var(--bg); border-radius: 10px; padding: 8px; vertical-align: top; border: 2px solid transparent; min-width: 0; }
table.decl td.ok { background: var(--good-soft); border-color: var(--good); }
table.decl td.ko { background: var(--bad-soft); border-color: var(--bad); }
table.decl td.given { background: transparent; border: 2px dashed var(--line); }
.cell { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-size: 1.2rem; min-height: 44px; }
.slot {
  font: inherit; font-weight: 700; min-width: 3.2em; min-height: 40px; padding: 2px 8px;
  border: 2px dashed var(--muted); background: var(--surface); color: var(--accent); border-radius: 8px; cursor: pointer;
}
.slot.active { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.slot:disabled { cursor: default; }
input.txt {
  font: inherit; font-weight: 700; color: var(--accent); width: 100%; min-width: 0;
  padding: 6px 8px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface);
}
input.txt.short { width: 4.2em; flex: 0 0 auto; }
.fix { width: 100%; font-size: .9rem; color: var(--bad); margin-top: 4px; }
.fix b { color: var(--ink); }
.mark { margin-left: auto; font-weight: 700; }
td.ok .mark { color: var(--good); }
td.ko .mark { color: var(--bad); }

.palette { display: flex; flex-wrap: wrap; gap: 8px; }
.end {
  font: inherit; font-size: 1.15rem; font-weight: 700; padding: 8px 16px; min-width: 64px;
  border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.end:hover { border-color: var(--accent); }
.end::before { content: "-"; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: inherit; font-weight: 700; padding: 11px 20px; border-radius: 10px; border: 2px solid var(--accent); cursor: pointer; background: var(--surface); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.small { padding: 8px 14px; font-size: .95rem; }

.explain { border-left: 4px solid var(--c, var(--accent)); padding: 6px 12px; background: var(--bg); border-radius: 0 8px 8px 0; }
.explain p { margin: 0; }

details.help { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
details.help summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
.models { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding-bottom: 16px; }
.model { border-top: 4px solid var(--c); background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.model h3 { margin: 0 0 6px; font-size: .95rem; color: var(--c); }
.model table { border-collapse: collapse; width: 100%; font-size: .95rem; }
.model td, .model th { padding: 2px 4px; text-align: left; }
.model th { color: var(--muted); font-weight: 400; font-size: .85rem; }
.model td { font-weight: 700; }
.rule { margin: 0 0 16px; }
.rule em { color: var(--muted); }

.final { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.final .big { font-family: var(--display); font-size: 3rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.final ul { text-align: left; margin: 0; padding-left: 1.2em; color: var(--muted); }

/* Plateau */
.board-view { display: flex; flex-direction: column; gap: 14px; }
.board-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
.board-wrap { overflow-x: auto; border-radius: 14px; background: var(--jb-ground); }
.board { display: grid; gap: 8px; padding: 12px; }
.bh { color: #fff; text-align: center; padding: 8px 4px 10px; border-bottom: 4px solid var(--c); display: flex; flex-direction: column; gap: 2px; justify-content: flex-end; }
.bh .dn { font-family: var(--display); font-weight: 700; font-size: .78rem; letter-spacing: .08em; color: var(--jb-gold); text-transform: uppercase; }
.bh .lw { font-size: 1.05rem; font-weight: 700; }
.bh .ls { font-size: .85rem; color: var(--jb-label); }
.rl { color: var(--jb-label); font-family: var(--display); font-weight: 700; font-size: .8rem; letter-spacing: .06em; display: flex; flex-direction: column; justify-content: center; text-transform: uppercase; padding-right: 4px; }
.rl small { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 400; }
.tile { font: inherit; border: 0; padding: 0; background: none; cursor: pointer; perspective: 800px; min-height: 72px; }
.tile .in { position: relative; display: block; width: 100%; height: 100%; min-height: 72px; transition: transform .5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.tile.open .in { transform: rotateY(180deg); }
.tile .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; border-radius: 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 4px; }
.tile .front { background: var(--jb-tile); box-shadow: inset 0 -4px 0 var(--jb-tile-edge); color: var(--jb-gold); font-family: var(--display); font-weight: 700; font-size: 1.2rem; text-shadow: 2px 2px 0 #000; letter-spacing: .04em; }
.tile .front .rd { font-family: var(--body); text-shadow: 1px 1px 0 #000; }
.tile:hover .front { filter: brightness(1.15); }
.tile .back { background: var(--jb-back); color: var(--jb-back-ink); transform: rotateY(180deg); font-size: 1.3rem; }
.tile .back b { color: var(--jb-red); }
.tile .back .var { font-size: .9rem; font-style: italic; }
.hint { margin: 0; color: var(--muted); font-size: .95rem; }
.home-link { color: var(--muted); text-decoration: none; font-weight: 700; font-size: .95rem; }

@media (max-width: 480px) {
  .tablet { padding: 14px; }
  table.decl { border-spacing: 4px; margin: -4px; width: calc(100% + 8px); }
  table.decl th { font-size: .72rem; }
  .cell { font-size: 1.05rem; }
  table.decl td { padding: 6px; }
  .slot { min-width: 2.6em; }
  details.panel, details.help { padding: 4px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i, .tile .in { transition: none; }
}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <a class="home-link" href="index.html">← Espace Latin 3ème</a>
    <h1>Tabula declinationum</h1>
    <p class="sub">Les terminaisons latines, à dévoiler sur le plateau ou à retrouver dans l'exercice.</p>
  </header>

  <details class="panel" id="panel">
    <summary>Paramètres de l'enseignant</summary>
    <div class="settings" id="settings"></div>
  </details>

  <div class="tabs" role="tablist" aria-label="Mode">
    <button type="button" role="tab" class="tab" id="tab-board" data-view="board">Plateau à dévoiler</button>
    <button type="button" role="tab" class="tab" id="tab-game" data-view="game">Exercice à compléter</button>
  </div>

  <section id="view-board" class="board-view" aria-label="Plateau">
    <div class="board-bar">
      <div class="row" id="bmodes"></div>
      <div class="row">
        <button type="button" class="btn small" id="b-all">Révéler tout</button>
        <button type="button" class="btn small" id="b-none">Tout voiler</button>
      </div>
    </div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <p class="hint">Clique sur une case pour dévoiler la terminaison : elle se revoile au bout de 2 secondes.</p>
  </section>

  <div id="view-game" class="game-view">
    <div class="progress"><span id="prog-txt">Mot 1 / 10</span><div class="bar"><i id="prog-bar"></i></div><span id="score-txt">0 pt</span></div>
    <main class="tablet" id="tablet" aria-live="polite"></main>
    <details class="help" id="help">
      <summary>Aide : les terminaisons</summary>
      <div id="help-body"></div>
    </details>
  </div>
</div>

<script>
// Terminaisons [singulier, pluriel] ; null = même forme que le nominatif singulier
const DECL = {
  '1':   { short: '1re', name: '1re déclinaison', c: '--d1', cut: 2, gs: 'ae',
           end: { nom: ['a', 'ae'], voc: ['a', 'ae'], acc: ['am', 'as'], gen: ['ae', 'arum'], dat: ['ae', 'is'], abl: ['a', 'is'] } },
  '2us': { short: '2e en -us', name: '2e déclinaison en -us', c: '--d2', cut: 1, gs: 'i',
           end: { nom: ['us', 'i'], voc: ['e', 'i'], acc: ['um', 'os'], gen: ['i', 'orum'], dat: ['o', 'is'], abl: ['o', 'is'] } },
  '2er': { short: '2e en -er', name: '2e déclinaison en -er', c: '--d2', cut: 1, gs: null,
           end: { nom: [null, 'i'], voc: [null, 'i'], acc: ['um', 'os'], gen: ['i', 'orum'], dat: ['o', 'is'], abl: ['o', 'is'] } },
  '2n':  { short: '2e neutre', name: '2e déclinaison neutre', c: '--d2', cut: 1, gs: 'i',
           end: { nom: ['um', 'a'], voc: ['um', 'a'], acc: ['um', 'a'], gen: ['i', 'orum'], dat: ['o', 'is'], abl: ['o', 'is'] } },
  '3p':  { short: '3e parisyllabique', name: '3e déclinaison parisyllabique', c: '--d3p', cut: 2, gs: 'is',
           end: { nom: [null, 'es'], voc: [null, 'es'], acc: ['em', 'es'], gen: ['is', 'ium'], dat: ['i', 'ibus'], abl: ['e', 'ibus'] },
           alt: { accP: ['is'], ablS: ['i'] } },
  '3i':  { short: '3e imparisyllabique', name: '3e déclinaison imparisyllabique', c: '--d3i', cut: 2, gs: null,
           end: { nom: [null, 'es'], voc: [null, 'es'], acc: ['em', 'es'], gen: ['is', 'um'], dat: ['i', 'ibus'], abl: ['e', 'ibus'] } },
  '3n':  { short: '3e neutre', name: '3e déclinaison neutre', c: '--d3i', cut: 2, gs: null,
           end: { nom: [null, 'a'], voc: [null, 'a'], acc: [null, 'a'], gen: ['is', 'um'], dat: ['i', 'ibus'], abl: ['e', 'ibus'] } },
  '4':   { short: '4e', name: '4e déclinaison', c: '--d4', cut: 2, gs: 'us',
           end: { nom: ['us', 'us'], voc: ['us', 'us'], acc: ['um', 'us'], gen: ['us', 'uum'], dat: ['ui', 'ibus'], abl: ['u', 'ibus'] } },
  '5':   { short: '5e', name: '5e déclinaison', c: '--d5', cut: 2, gs: null,
           end: { nom: ['es', 'es'], voc: ['es', 'es'], acc: ['em', 'es'], gen: ['ei', 'erum'], dat: ['ei', 'ebus'], abl: ['e', 'ebus'] } }
};
const CASES = [['nom', 'Nominatif'], ['voc', 'Vocatif'], ['acc', 'Accusatif'], ['gen', 'Génitif'], ['dat', 'Datif'], ['abl', 'Ablatif']];
const NUMS = [['S', 'Singulier'], ['P', 'Pluriel']];
// [nominatif, génitif, genre, sens, déclinaison, syllabes nom/gén (3e)]
const WORDS = [
  ['puella', 'puellae', 'f', 'la jeune fille', '1'], ['rosa', 'rosae', 'f', 'la rose', '1'],
  ['filia', 'filiae', 'f', 'la fille', '1'], ['via', 'viae', 'f', 'la route', '1'],
  ['insula', 'insulae', 'f', "l'île", '1'], ['silva', 'silvae', 'f', 'la forêt', '1'],
  ['porta', 'portae', 'f', 'la porte', '1'], ['regina', 'reginae', 'f', 'la reine', '1'],
  ['nauta', 'nautae', 'm', 'le marin', '1'], ['agricola', 'agricolae', 'm', "l'agriculteur", '1'],
  ['aqua', 'aquae', 'f', "l'eau", '1'], ['ancilla', 'ancillae', 'f', 'la servante', '1'],
  ['dominus', 'domini', 'm', 'le maître', '2us'], ['servus', 'servi', 'm', "l'esclave", '2us'],
  ['amicus', 'amici', 'm', "l'ami", '2us'], ['lupus', 'lupi', 'm', 'le loup', '2us'],
  ['equus', 'equi', 'm', 'le cheval', '2us'], ['murus', 'muri', 'm', 'le mur', '2us'],
  ['hortus', 'horti', 'm', 'le jardin', '2us'], ['ventus', 'venti', 'm', 'le vent', '2us'],
  ['oculus', 'oculi', 'm', "l'œil", '2us'], ['annus', 'anni', 'm', "l'année", '2us'],
  ['populus', 'populi', 'm', 'le peuple', '2us'], ['legatus', 'legati', 'm', "l'ambassadeur", '2us'],
  ['puer', 'pueri', 'm', "l'enfant", '2er'], ['ager', 'agri', 'm', 'le champ', '2er'],
  ['liber', 'libri', 'm', 'le livre', '2er'], ['magister', 'magistri', 'm', 'le maître d\'école', '2er'],
  ['templum', 'templi', 'n', 'le temple', '2n'], ['bellum', 'belli', 'n', 'la guerre', '2n'],
  ['donum', 'doni', 'n', 'le cadeau', '2n'], ['oppidum', 'oppidi', 'n', 'la place forte', '2n'],
  ['verbum', 'verbi', 'n', 'le mot', '2n'], ['periculum', 'periculi', 'n', 'le danger', '2n'],
  ['forum', 'fori', 'n', 'le forum', '2n'], ['saxum', 'saxi', 'n', 'le rocher', '2n'],
  ['civis', 'civis', 'm', 'le citoyen', '3p', ['ci·vis', 'ci·vis']],
  ['navis', 'navis', 'f', 'le navire', '3p', ['na·vis', 'na·vis']],
  ['hostis', 'hostis', 'm', "l'ennemi", '3p', ['hos·tis', 'hos·tis']],
  ['avis', 'avis', 'f', "l'oiseau", '3p', ['a·vis', 'a·vis']],
  ['ovis', 'ovis', 'f', 'la brebis', '3p', ['o·vis', 'o·vis']],
  ['collis', 'collis', 'm', 'la colline', '3p', ['col·lis', 'col·lis']],
  ['nubes', 'nubis', 'f', 'le nuage', '3p', ['nu·bes', 'nu·bis']],
  ['vulpes', 'vulpis', 'f', 'le renard', '3p', ['vul·pes', 'vul·pis']],
  ['ignis', 'ignis', 'm', 'le feu', '3p', ['ig·nis', 'ig·nis']],
  ['finis', 'finis', 'm', 'la limite', '3p', ['fi·nis', 'fi·nis']],
  ['rex', 'regis', 'm', 'le roi', '3i', ['rex', 're·gis']],
  ['consul', 'consulis', 'm', 'le consul', '3i', ['con·sul', 'con·su·lis']],
  ['miles', 'militis', 'm', 'le soldat', '3i', ['mi·les', 'mi·li·tis']],
  ['dux', 'ducis', 'm', 'le chef', '3i', ['dux', 'du·cis']],
  ['homo', 'hominis', 'm', "l'homme", '3i', ['ho·mo', 'ho·mi·nis']],
  ['leo', 'leonis', 'm', 'le lion', '3i', ['le·o', 'le·o·nis']],
  ['soror', 'sororis', 'f', 'la sœur', '3i', ['so·ror', 'so·ro·ris']],
  ['uxor', 'uxoris', 'f', "l'épouse", '3i', ['u·xor', 'u·xo·ris']],
  ['virtus', 'virtutis', 'f', 'le courage', '3i', ['vir·tus', 'vir·tu·tis']],
  ['lex', 'legis', 'f', 'la loi', '3i', ['lex', 'le·gis']],
  ['vox', 'vocis', 'f', 'la voix', '3i', ['vox', 'vo·cis']],
  ['labor', 'laboris', 'm', 'le travail', '3i', ['la·bor', 'la·bo·ris']],
  ['pastor', 'pastoris', 'm', 'le berger', '3i', ['pas·tor', 'pas·to·ris']],
  ['mulier', 'mulieris', 'f', 'la femme', '3i', ['mu·li·er', 'mu·li·e·ris']],
  ['civitas', 'civitatis', 'f', 'la cité', '3i', ['ci·vi·tas', 'ci·vi·ta·tis']],
  ['imperator', 'imperatoris', 'm', 'le général', '3i', ['im·pe·ra·tor', 'im·pe·ra·to·ris']],
  ['corpus', 'corporis', 'n', 'le corps', '3n', ['cor·pus', 'cor·po·ris']],
  ['tempus', 'temporis', 'n', 'le temps', '3n', ['tem·pus', 'tem·po·ris']],
  ['nomen', 'nominis', 'n', 'le nom', '3n', ['no·men', 'no·mi·nis']],
  ['flumen', 'fluminis', 'n', 'le fleuve', '3n', ['flu·men', 'flu·mi·nis']],
  ['carmen', 'carminis', 'n', 'le chant', '3n', ['car·men', 'car·mi·nis']],

  ['res', 'rei', 'f', 'la chose', '5'], ['dies', 'diei', 'm', 'le jour', '5']
];
const DEFAULT_MODELS = { '1': 'puella', '2us': 'dominus', '2er': 'puer', '2n': 'templum', '3p': 'civis', '3i': 'rex', '3n': 'corpus', '4': 'manus', '5': 'res' };
const DEFAULT_CFG = { decls: ['1', '2us', '3p', '3i'], cases: ['nom', 'acc', 'gen'], nums: ['S', 'P'], models: { ...DEFAULT_MODELS }, level: '1', count: 10, eleve: false };
const LEVELS = [['1', 'Je clique la terminaison'], ['2', "J'écris la terminaison"], ['3', "J'écris le mot entier"]];
const BMODES = [['word', 'Avec un mot'], ['end', 'Terminaisons seules']];
const CLOSE_AFTER = 2000;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&"<>]/g, c => ({ '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;' })[c]);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim()
  .replace(/^-/, '').replace(/j/g, 'i').replace(/v/g, 'u');
const caseName = c => CASES.find(x => x[0] === c)[1];
const numName = n => NUMS.find(x => x[0] === n)[1];

function word(i) {
  const [nom, gen, g, sens, d, syl] = WORDS[i];
  const rad = gen.slice(0, gen.length - DECL[d].cut);
  return { i, nom, gen, g, sens, d, syl, rad, genShort: DECL[d].gs || gen };
}
const findWord = nom => WORDS.findIndex(w => w[0] === nom);
const ending = (d, cell) => DECL[d].end[cell.slice(0, 3)][cell[3] === 'S' ? 0 : 1];
const isGiven = (w, cell) => cell === 'nomS' || ending(w.d, cell) === null;
function expected(w, cell) {
  const e = ending(w.d, cell);
  if (e === null) return [w.nom];
  return [w.rad + e, ...((DECL[w.d].alt || {})[cell] || []).map(a => w.rad + a)];
}

let state;
const cfg = () => state.cfg;
// Cellules affichées : cas choisis × nombres choisis, dans l'ordre du tableau
const cells = () => cfg().cases.flatMap(c => cfg().nums.map(n => c + n));
const askedCells = w => cells().filter(c => !isGiven(w, c));

function answerOf(w, cell) {
  const a = state.answers[cell] || '';
  return cfg().level === '3' ? a : (a ? w.rad + norm(a) : '');
}
function isRight(w, cell) {
  const a = norm(answerOf(w, cell));
  return a !== '' && expected(w, cell).some(e => norm(e) === a);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Paramètres : stockage local et lien élève ---------- */
function cleanCfg(c) {
  const out = { ...DEFAULT_CFG, ...c, models: { ...DEFAULT_MODELS, ...(c.models || {}) } };
  out.decls = Object.keys(DECL).filter(k => (out.decls || []).includes(k));
  out.cases = CASES.map(x => x[0]).filter(k => (out.cases || []).includes(k));
  out.nums = NUMS.map(x => x[0]).filter(k => (out.nums || []).includes(k));
  if (!out.decls.length) out.decls = [...DEFAULT_CFG.decls];
  if (!out.cases.length) out.cases = [...DEFAULT_CFG.cases];
  if (!out.nums.length) out.nums = [...DEFAULT_CFG.nums];
  Object.keys(out.models).forEach(d => { const i = findWord(out.models[d]); if (i < 0 || WORDS[i][4] !== d) out.models[d] = DEFAULT_MODELS[d]; });
  if (!LEVELS.some(l => l[0] === out.level)) out.level = '1';
  out.count = [5, 10, 15, 20].includes(+out.count) ? +out.count : 10;
  return out;
}
function readParams() {
  let q;
  try { q = new URLSearchParams(location.search); } catch (e) { return null; }
  if (!q.has('d') && !q.has('c')) return null;
  const list = k => (q.get(k) || '').split(',').filter(Boolean);
  const models = {};
  list('m').forEach(p => { const [d, n] = p.split(':'); if (d && n) models[d] = n; });
  return {
    cfg: cleanCfg({ decls: list('d'), cases: list('c'), nums: list('n'), models, level: q.get('niv') || '1', count: q.get('nb') || 10, eleve: q.get('eleve') === '1' }),
    view: q.get('vue') === 'exercice' ? 'game' : 'board'
  };
}
function studentLink() {
  const c = cfg();
  let base = '';
  try { base = location.href.split(/[?#]/)[0]; } catch (e) {}
  const p = new URLSearchParams();
  p.set('d', c.decls.join(','));
  p.set('c', c.cases.join(','));
  p.set('n', c.nums.join(','));
  p.set('m', c.decls.map(d => d + ':' + c.models[d]).join(','));
  p.set('niv', c.level);
  p.set('nb', c.count);
  if (state.view === 'game') p.set('vue', 'exercice');
  if (state.linkEleve) p.set('eleve', '1');
  return base + '?' + p.toString().replace(/%2C/g, ',').replace(/%3A/g, ':');
}
function loadPrefs() {
  try { const p = JSON.parse(localStorage.getItem('tabula-cfg-v2') || 'null'); if (p) return p; } catch (e) {}
  return null;
}
function savePrefs() {
  if (state.fromLink) return;
  try { localStorage.setItem('tabula-cfg-v2', JSON.stringify({ cfg: state.cfg, view: state.view, bmode: state.board.mode })); } catch (e) {}
}

}
function toggleIn(list, k) { return list.includes(k) ? (list.length > 1 ? list.filter(x => x !== k) : list) : [...list, k]; }

      <p class="note">Le lien reprend tous les réglages ci-dessus et l'onglet ouvert. Il fonctionne depuis votre site GitHub.</p></div>`;

  LEVELS.forEach(([k]) => $('#sl-' + k).onclick = () => { if (c.level === k) return; c.level = k; if (!state.done) startWord(); apply(); });
  $('#s-count').onchange = e => { c.count = +e.target.value; newSeries(); apply(); };
  $('#s-eleve').onchange = e => { state.linkEleve = e.target.checked; $('#s-link').value = studentLink(); };
  $('#s-copy').onclick = () => {
    const inp = $('#s-link'), btn = $('#s-copy');
    const done = () => { btn.textContent = 'Lien copié'; setTimeout(() => btn.textContent = 'Copier le lien', 1800); };
    const fallback = () => { inp.focus(); inp.select(); btn.textContent = 'Lien sélectionné : Cmd+C'; };

  const c = cfg();

/* ---------- Plateau ---------- */
let timers = {};
function clearTimers() { Object.values(timers).forEach(clearTimeout); timers = {}; }
function setTile(t, open) {
  const k = t.dataset.key;
  if (open) state.board.open[k] = true; else delete state.board.open[k];
  t.classList.toggle('open', open);
  t.setAttribute('aria-pressed', open);
}
function setAll(open) { clearTimers(); document.querySelectorAll('#board .tile').forEach(t => setTile(t, open)); }

function tileFront(w, cell) {
  if (state.board.mode === 'end' || isGiven(w, cell) && cell !== 'nomS') return '?';
  if (cell === 'nomS' && ending(w.d, 'nomS') === null) return '?';
  return `<span class="rd">${w.rad}-</span>`;
}
function tileBack(w, cell) {
  const e = ending(w.d, cell);
  if (state.board.mode === 'end') return e === null ? '<span class="var">= nominatif</span>' : `<b>-${e}</b>`;
  if (e === null) return `<b>${w.nom}</b>`;
  return `<span>${w.rad}<b>${e}</b></span>`;
}
function renderBoard() {
  clearTimers();
  const c = cfg();
  const b = $('#board');
  const wm = state.board.mode === 'word';
  b.style.gridTemplateColumns = `minmax(84px, auto) repeat(${c.decls.length}, minmax(104px, 1fr))`;
  b.style.minWidth = (100 + 112 * c.decls.length) + 'px';
  let h = '<div></div>' + c.decls.map(d => {
    const w = word(findWord(c.models[d]));
    return `<div class="bh" style="--c: var(${DECL[d].c})"><span class="dn">${DECL[d].short}</span>${wm ? `<span class="lw">${w.nom}, ${w.genShort} ${w.g}.</span><span class="ls">${w.sens}</span>` : ''}</div>`;
  }).join('');
  cells().forEach(cell => {
    const cas = caseName(cell.slice(0, 3)), nb = numName(cell[3]).toLowerCase();
    h += `<div class="rl">${cas}<small>${nb}</small></div>`;
    c.decls.forEach(d => {
      const w = word(findWord(c.models[d]));
      const key = d + '|' + cell;
      const open = !!state.board.open[key];
      h += `<button type="button" class="tile${open ? ' open' : ''}" data-key="${key}" aria-pressed="${open}" aria-label="${DECL[d].short}, ${cas} ${nb}"><span class="in"><span class="face front">${tileFront(w, cell)}</span><span class="face back">${tileBack(w, cell)}</span></span></button>`;
    });
  });
  b.innerHTML = h;
  b.querySelectorAll('.tile').forEach(t => t.onclick = () => {
    const k = t.dataset.key;
    const open = !state.board.open[k];
    setTile(t, open);
    clearTimeout(timers[k]);
    if (open) timers[k] = setTimeout(() => setTile(t, false), CLOSE_AFTER);
  });
  const m = $('#bmodes');
  m.innerHTML = BMODES.map(([k, l]) => chip('bm-' + k, l, state.board.mode === k)).join('');
  BMODES.forEach(([k]) => $('#bm-' + k).onclick = () => { state.board.mode = k; state.board.open = {}; savePrefs(); renderBoard(); });
}

/* ---------- Exercice ---------- */
function newSeries() {
  const pool = WORDS.map((_, i) => i).filter(i => cfg().decls.includes(WORDS[i][4]));
  state.series = shuffle(pool).slice(0, Math.min(cfg().count, pool.length));
  state.pos = 0; state.score = 0; state.max = 0; state.history = []; state.done = false;
  startWord();
}
function startWord() {
  state.answers = {}; state.checked = false;
  const w = word(state.series[state.pos]);
  state.active = askedCells(w)[0] || null;
  render();
}
function palette(w) {
  const asked = askedCells(w);
  const own = new Set(asked.map(c => ending(w.d, c)));
  const others = cfg().decls.length > 1 ? cfg().decls.filter(d => d !== w.d) : Object.keys(DECL).filter(d => d !== w.d);
  const pool = [...new Set(others.flatMap(d => asked.map(c => ending(d, c))).filter(e => e && !own.has(e)))];
  const extra = shuffle(pool).slice(0, Math.max(2, 7 - own.size));
  return [...own, ...extra].sort();
}

function cellHTML(w, cell) {
  if (isGiven(w, cell)) return `<td class="given"><div class="cell"><span>${w.nom}</span></div></td>`;
  const a = state.answers[cell] || '';
  const ck = state.checked;
  const ok = ck && isRight(w, cell);
  const cls = ck ? (ok ? 'ok' : 'ko') : '';
  const mark = ck ? `<span class="mark" aria-label="${ok ? 'juste' : 'faux'}">${ok ? '✓' : '✗'}</span>` : '';
  const fix = ck && !ok ? `<div class="fix">→ <b>${expected(w, cell).join(' ou ')}</b></div>` : '';
  const lab = `${caseName(cell.slice(0, 3))} ${numName(cell[3]).toLowerCase()}`;
  let inner;
  if (cfg().level === '1') {
    inner = `<span>${w.rad}</span><button type="button" class="slot${state.active === cell && !ck ? ' active' : ''}" data-cell="${cell}" ${ck ? 'disabled' : ''} aria-label="Terminaison, ${lab}">${esc(a) || '…'}</button>`;
  } else if (cfg().level === '2') {
    inner = `<span>${w.rad}</span><input class="txt short" id="in-${cell}" data-cell="${cell}" value="${esc(a)}" ${ck ? 'disabled' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminaison, ${lab}">`;
  } else {
    inner = `<input class="txt" id="in-${cell}" data-cell="${cell}" value="${esc(a)}" ${ck ? 'disabled' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${lab}">`;
  }
  return `<td class="${cls}"><div class="cell">${inner}${mark}${fix}</div></td>`;
}

function render() {
  const t = $('#tablet');
  const n = state.series.length;
  $('#prog-bar').style.width = (100 * (state.pos + (state.checked || state.done ? 1 : 0)) / n) + '%';
  $('#score-txt').textContent = `${state.score} / ${state.max} pts`;

  if (state.done) {
    $('#prog-txt').textContent = 'Série terminée';
    const errs = state.history.filter(h => h.errors.length);
    const max = state.max || 1;
    t.innerHTML = `<div class="final">
      <div class="big">${state.score} / ${state.max}</div>
      <p>${state.score === state.max ? 'Optime ! Aucune faute.' : state.score >= max * .75 ? 'Bene ! Encore un petit effort.' : 'Continue, chaque série te fait progresser.'}</p>
      ${errs.length ? `<div><p><b>À revoir :</b></p><ul>${errs.map(h => `<li><b>${h.nom}</b> (${DECL[h.d].short}) : ${h.errors.join(', ')}</li>`).join('')}</ul></div>` : ''}
      <button type="button" class="btn primary" id="again">Nouvelle série</button>
    </div>`;
    $('#again').onclick = newSeries;
    return;
  }

  $('#prog-txt').textContent = `Mot ${state.pos + 1} / ${n}`;
  const w = word(state.series[state.pos]);
  const d = DECL[w.d];
  const badge = state.checked ? `<span class="badge" style="--c: var(${d.c})">${d.short}</span>` : '';
  let explain = '';
  if (state.checked) {
    let txt = `<b>${w.nom}</b>, génitif <b>${w.gen}</b> : radical <b>${w.rad}-</b>.`;
    if (w.syl && w.d !== '3n') {
      const a = w.syl[0].split('·').length, b = w.syl[1].split('·').length;
      txt += ` ${w.syl[0]} (${a} syll.) / ${w.syl[1]} (${b} syll.) → ${a === b ? 'parisyllabique, génitif pluriel en <b>-ium</b>' : 'imparisyllabique, génitif pluriel en <b>-um</b>'}.`;
    }
    if (w.d === '2n' || w.d === '3n') txt += ' Neutre : nominatif, vocatif et accusatif sont identiques ; au pluriel, ils se terminent en <b>-a</b>.';
    explain = `<div class="explain" style="--c: var(${d.c})"><p>${txt}</p></div>`;
  }
  const nums = cfg().nums;
  t.innerHTML = `
    <div class="lemma"><span class="w">${w.nom}, ${w.genShort}</span><span class="g">${w.g}.</span>${badge}<span class="sens">${w.sens}</span></div>
    <div class="tbl-wrap"><table class="decl">
      <thead><tr><th></th>${nums.map(x => `<th>${numName(x)}</th>`).join('')}</tr></thead>
      <tbody>${cfg().cases.map(c => `<tr><th scope="row">${caseName(c)}</th>${nums.map(x => cellHTML(w, c + x)).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${cfg().level === '1' && !state.checked && askedCells(w).length ? `<div class="palette" role="group" aria-label="Terminaisons">${palette(w).map(e => `<button type="button" class="end" data-end="${e}">${e}</button>`).join('')}</div>` : ''}
    ${explain}
    <div class="actions">
      ${state.checked
        ? `<button type="button" class="btn primary" id="next">${state.pos + 1 < n ? 'Mot suivant' : 'Voir mon score'}</button>`
        : `<button type="button" class="btn primary" id="check">Vérifier</button><button type="button" class="btn" id="clear">Effacer</button>`}
    </div>`;

  t.querySelectorAll('.slot').forEach(b => b.onclick = () => { state.active = b.dataset.cell; render(); });
  t.querySelectorAll('.end').forEach(b => b.onclick = () => {
    if (!state.active) return;
    state.answers[state.active] = b.dataset.end;
    const asked = askedCells(w);
    const after = asked.slice(asked.indexOf(state.active) + 1).find(c => !state.answers[c]);
    state.active = after || asked.find(c => !state.answers[c]) || state.active;
    render();
    const s = t.querySelector('.slot.active'); if (s) s.focus();
  });
  const inputs = [...t.querySelectorAll('input.txt')];
  inputs.forEach((inp, i) => {
    inp.oninput = () => { state.answers[inp.dataset.cell] = inp.value; };
    inp.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus(); else check();
    };
  });
  if (state.view === 'game') {
    if (inputs.length && !state.checked) inputs[0].focus({ preventScroll: true });
    if ($('#next')) $('#next').focus({ preventScroll: true });
  }
  if ($('#check')) $('#check').onclick = check;
  if ($('#clear')) $('#clear').onclick = startWord;
  if ($('#next')) $('#next').onclick = next;
}

function check() {
  const w = word(state.series[state.pos]);
  const asked = askedCells(w);
  const errors = asked.filter(c => !isRight(w, c)).map(c => expected(w, c)[0]);
  state.score += asked.length - errors.length;
  state.max += asked.length;
  state.history.push({ nom: w.nom, d: w.d, errors });
  state.checked = true;
  render();
}
function next() {
  if (state.pos + 1 < state.series.length) { state.pos++; startWord(); }
  else { state.done = true; render(); }
}

/* ---------- Vues ---------- */
function showView() {
  const board = state.view === 'board';
  $('#view-board').hidden = !board;
  $('#view-game').hidden = board;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === state.view));
  const link = $('#s-link'); if (link) link.value = studentLink();
}
function refreshAll() { renderSettings(); renderHelp(); renderBoard(); render(); showView(); }

function start(saved) {
  const fromLink = readParams();
  if (saved && saved.cfg && saved.series) {
    state = saved;
  } else if (fromLink) {
    state = { cfg: fromLink.cfg, view: fromLink.view, board: { mode: 'word', open: {} }, fromLink: true };
  } else {
    const p = loadPrefs() || {};
    state = { cfg: cleanCfg(p.cfg || DEFAULT_CFG), view: p.view || 'board', board: { mode: p.bmode || 'word', open: {} } };
  }
  state.cfg = cleanCfg(state.cfg);
  state.board = state.board || { mode: 'word', open: {} };
  state.board.open = state.board.open || {};
  $('#panel').hidden = !!state.cfg.eleve;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.view = t.dataset.view; savePrefs(); showView(); });
  $('#b-all').onclick = () => setAll(true);
  $('#b-none').onclick = () => setAll(false);
  if (!state.series) newSeries();
  refreshAll();
}
start({});
</script>
